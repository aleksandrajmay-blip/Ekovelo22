<style>
:root{--bg:#070a10;--tx:#f2f6fb;--mt:rgba(235,242,255,.62);--ac:#6ff3dd;--ac2:#8b95ff;--bd:rgba(255,255,255,.17);--st:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}

body{margin:0;color:var(--tx);font-family:-apple-system,"SF Pro Display",system-ui,Roboto,sans-serif;min-height:100vh;padding:var(--st) 18px 130px;overflow-x:hidden}
.au{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.au i{position:absolute;border-radius:50%;filter:blur(75px);opacity:.6;animation:fl 16s ease-in-out infinite alternate}
.au i:nth-child(1){width:380px;height:380px;background:#14b8a6;top:-110px;left:-120px}
.au i:nth-child(2){width:340px;height:340px;background:#6366f1;top:28%;right:-140px;animation-delay:-5s}
.au i:nth-child(3){width:360px;height:360px;background:#d946ef;bottom:-130px;left:5%;animation-delay:-9s;opacity:.45}
@keyframes fl{to{transform:translate(50px,70px) scale(1.18)}}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.98)}}
.gl{background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.04) 52%,rgba(255,255,255,.1));backdrop-filter:blur(24px) saturate(190%) brightness(1.08);-webkit-backdrop-filter:blur(24px) saturate(190%) brightness(1.08);
border:1px solid var(--bd);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),inset 0 0 22px rgba(255,255,255,.05),0 12px 32px rgba(0,0,0,.28)}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650}
.lg{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#06222a;user-select:none;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 22px rgba(111,243,221,.35)}
.gear{display:none;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;cursor:pointer;color:var(--ac)}
.bal{padding:10px 17px;border-radius:99px;cursor:pointer}.bal b{color:var(--ac)}
h1{font-size:1.85rem;font-weight:700;margin:22px 0 6px}h2{font-size:1.45rem;font-weight:700;margin:0}
.hd{display:flex;align-items:center;justify-content:space-between;margin:22px 0 4px}
.info{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ac);font-weight:700}
.mt{color:var(--mt);font-size:.92rem}.note{font-size:.76rem;color:var(--mt);line-height:1.5}
.sec{font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--mt);margin:28px 0 12px}
.hero{position:relative;overflow:hidden;padding:24px;margin-top:18px;animation:up .5s both}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(111,243,221,.4),transparent 70%)}
.hero .big{font-size:2.6rem;font-weight:750;margin:6px 0 16px;letter-spacing:-1px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.q{padding:18px;cursor:pointer;animation:up .5s both;transition:transform .15s;font-weight:550}.q:active{transform:scale(.95)}
.q i{display:flex;width:46px;height:46px;border-radius:15px;align-items:center;justify-content:center;color:var(--ac);margin-bottom:12px;background:rgba(111,243,221,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:16px 2px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:104px;padding:11px 18px;border-radius:24px;text-align:center;cursor:pointer;color:var(--mt);transition:.3s;position:relative}
.chip b{display:block;font-size:.95rem;color:var(--tx);font-weight:650}.chip small{display:block;font-size:.66rem;margin-top:2px;opacity:.85}
.chip.on{background:linear-gradient(160deg,rgba(111,243,221,.38),rgba(111,243,221,.1));border-color:rgba(111,243,221,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 26px rgba(111,243,221,.25)}
.chip em{position:absolute;top:-6px;right:-4px;width:22px;height:22px;border-radius:50%;background:#fff;color:#000;font-size:.65rem;display:flex;align-items:center;justify-content:center;font-style:normal}
.card{position:relative;padding:18px;margin-bottom:14px;animation:up .55s both}
.ph{display:flex;gap:14px;align-items:center}
.tile{flex:none;width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.75rem;background:linear-gradient(135deg,rgba(111,243,221,.25),rgba(139,149,255,.25));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.card h3{margin:0 0 4px;font-size:1.05rem}.card p{margin:0;font-size:.85rem;color:var(--mt);line-height:1.4}
.pf{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.tag{padding:5px 13px;border-radius:99px;font-size:.76rem;background:rgba(255,255,255,.12);color:var(--mt)}

.btn{width:100%;border:1px solid rgba(255,255,255,.34);border-radius:20px;padding:15px;margin-top:12px;font:inherit;font-size:1rem;font-weight:650;cursor:pointer;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.25);
background:linear-gradient(180deg,rgba(111,243,221,.55),rgba(20,184,166,.28));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.1),0 8px 24px rgba(20,184,166,.25);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.g{background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px rgba(0,0,0,.2)}
.btn.d{background:linear-gradient(180deg,rgba(251,113,133,.4),rgba(244,63,94,.15));border-color:rgba(251,113,133,.5)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mt);padding:44px 10px 10px}.empty svg{width:60px;height:60px;stroke-width:1.1;margin-bottom:10px}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.amts div{padding:16px 0;text-align:center;border-radius:20px;cursor:pointer;font-weight:650;transition:.25s}
.amts .on{background:linear-gradient(160deg,rgba(111,243,221,.38),rgba(111,243,221,.1));border-color:rgba(111,243,221,.6);color:#fff}
.mth{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer;animation:up .5s both;transition:transform .15s}.mth:active{transform:scale(.97)}
.mth .tile{width:48px;height:48px;font-size:1.4rem;border-radius:16px}.mth .t{flex:1}.mth .t b{display:block}.mth .t small{color:var(--mt);font-size:.78rem}.mth>span{color:var(--mt);font-size:1.4rem}
nav{position:fixed;left:18px;right:18px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;padding:6px;border-radius:38px;z-index:5}
nav .lens{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 14px rgba(255,255,255,.12),0 3px 12px rgba(0,0,0,.3);transition:transform .5s cubic-bezier(.3,1.35,.5,1)}
nav div{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;font-size:.68rem;color:var(--mt);cursor:pointer;transition:color .3s}
nav .on{color:#fff}nav .on svg{stroke:var(--ac)}
.help{position:fixed;right:20px;bottom:108px;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:1.25rem;z-index:4}
.toast{position:fixed;top:calc(var(--st) + 12px);left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:99px;display:none;z-index:40;font-size:.9rem}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;z-index:21;border-radius:32px 32px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 40%,rgba(255,255,255,.1));backdrop-filter:blur(44px) saturate(200%) brightness(.9);-webkit-backdrop-filter:blur(44px) saturate(200%) brightness(.9);border:1px solid var(--bd);border-bottom:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.6);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:none}.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.3);margin:4px auto 8px}.sheet h2{margin:8px 0 2px}
.md{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:25;padding:24px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}.md.on{display:flex}
.mb{max-width:360px;width:100%;padding:24px;animation:pop .45s cubic-bezier(.2,1.2,.4,1);background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.07))}
@keyframes pop{from{opacity:0;transform:scale(.82)}}
.stp{display:flex;gap:12px;margin:13px 0;font-size:.93rem;line-height:1.45}.stp b{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(111,243,221,.25);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:.8rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.f{margin:16px 0}.f label{display:block;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--mt);margin:0 0 8px 4px}
.f input,.f textarea,.f select{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--bd);border-radius:18px;padding:14px 16px;color:var(--tx);font:inherit;font-size:16px;outline:0;transition:.25s;appearance:none;box-shadow:inset 0 2px 8px rgba(0,0,0,.18)}
.f select option{color:#000}.f textarea{resize:none;min-height:84px}
.f input:focus,.f textarea:focus,.f select:focus{border-color:rgba(111,243,221,.7);box-shadow:0 0 0 4px rgba(111,243,221,.15),inset 0 2px 8px rgba(0,0,0,.18);background:rgba(255,255,255,.12)}
.sfx{position:relative}.sfx::after{content:"₽";position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--ac);font-weight:700;pointer-events:none}
.em{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.em span{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:rgba(255,255,255,.1);border:1px solid var(--bd);cursor:pointer}
.it{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;border-radius:20px}
.it .t{flex:1;min-width:0}.it .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .t small{color:var(--mt)}.it .tile{width:44px;height:44px;font-size:1.3rem;border-radius:14px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:6px 4px}.sw input{display:none}
.sw i{position:relative;flex:none;width:54px;height:31px;border-radius:99px;background:rgba(255,255,255,.18);transition:.3s;box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sw input:checked+i{background:var(--ac)}.sw input:checked+i::after{transform:translateX(23px)}
.cp{padding:16px;margin:14px 0;word-break:break-all;font-family:ui-monospace,Menlo,monospace;cursor:pointer;text-align:center}
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.lb{font-size:.82rem;color:var(--mt)}.gr{color:#6ee7a0;font-weight:550;margin-top:6px;line-height:1.35}
.g2{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.gd{display:flex;align-items:center;gap:8px;color:#6ee7a0;font-size:.76rem;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}.gd svg{width:18px;height:18px;flex:none}
</style>
</head>
<body>
<div class="au"><i></i><i></i><i></i></div><canvas id="snow"></canvas>
<div class="toast gl" id="toast"></div>
<div class="top"><div class="brand"><div class="lg" id="lg"></div><span id="nm"></span><div class="gear gl" id="gear" onclick="adminSheet()"></div></div><div class="bal gl" onclick="go('topup')"><b id="bal">0</b> ₽</div></div>
<main id="view"></main>
<div class="help gl" onclick="help()">?</div>
<nav class="gl" id="nav"></nav>
<div class="bg" id="bg" onclick="closeSheet()"></div>
<div class="sheet" id="sh"></div>
<div class="md" id="md" onclick="if(event.target===this)closeHelp()"><div class="mb gl" id="mb"></div></div>

<script>
// SHA-256 от "логин:пароль". Пароль в коде не хранится.
const ADMIN_HASH='c90705bc170bca0f7ded71164b623956a74e3f914654b69d8eda773010c97006';
// ---- Supabase: вставьте свои значения из Settings → API вашего проекта ----
const SUPABASE_URL=''; // вставьте сюда Project URL вида https://xxxxxxxx.supabase.co
const SUPABASE_ANON_KEY='sb_publishable_K9UkXAOtJIcf0HbwfJUkmA_kYV4NaB3';
const sb=(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let ADMIN_TOKEN=sessionStorage.getItem('admtok')||'';
const DEF={name:'Mini Shop',support:'@your_support',wallet:'',demo:true,minTop:3000,freeFrom:20000,fee:0,promos:[],snow:true,statusLabel:'Статус',badgeLabel:'Формат',guarantee:'Гарантия возврата / замены',
cats:[{id:1,name:'Софт',sub:'Ключи и плагины'},{id:2,name:'Графика',sub:'Паки и шаблоны'},{id:3,name:'Звук',sub:'Лупы и сэмплы'}],
products:[
{id:1,cat:1,name:'Лицензионный ключ Pro',desc:'Годовая лицензия на профессиональную версию',price:1500,icon:'🔑',badge:'Ключ'},
{id:2,cat:1,name:'Плагин-пак для монтажа',desc:'Набор из 12 плагинов и пресетов',price:2900,icon:'🎬',badge:'Плагин'},
{id:3,cat:2,name:'Neon Pack — 50 текстур',desc:'Киберпанк-текстуры 4K для 3D и дизайна',price:490,icon:'🎨',badge:'4K'},
{id:4,cat:2,name:'Cyber UI Kit',desc:'Интерфейсы и компоненты для Figma',price:1290,icon:'🖥️',badge:'Figma'},
{id:5,cat:3,name:'Synthwave Loops',desc:'30 лупов в формате WAV',price:790,icon:'🎧',badge:'WAV'}],
methods:[{id:1,type:'ym',title:'Карта / ЮMoney',sub:'Мгновенное зачисление',req:'',note:''},
{id:2,type:'bank',title:'Банковский перевод',sub:'По реквизитам',req:'',note:''},
{id:3,type:'crypto',title:'Криптовалюта',sub:'USDT и другие',req:'',note:''}],
help:{home:'Здесь ваш баланс и быстрые действия.\nНажмите «Каталог», чтобы выбрать товар.\nБаланс пополняется в разделе «Пополнить».',
catalog:'Выберите категорию в верхней ленте.\nНажмите «Купить» — сумма спишется с баланса.\nПокупка появится в разделе «Заказы».',
orders:'Здесь хранится история ваших покупок.\nНе пришёл товар? Напишите в поддержку.\nНовые покупки — в каталоге.',
topup:'Выберите сумму пополнения.\nВыберите способ: карта, банковский перевод или криптовалюта.\nПри переводе по реквизитам нажмите «Я оплатил(а)» — откроется чат с поддержкой.\nЕсть промокод? Нажмите «Промокод» и введите его — бонус добавится к пополнению.\nПроверка зачисления занимает от 1 до 10 минут.'}};
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',catalog:'<path d="M5 7h14l-1 13H6zM9 7a3 3 0 0 1 6 0"/>',orders:'<path d="M12 3l9 5v8l-9 5-9-5V8zM3 8l9 5 9-5M12 13v8"/>',topup:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 11h18"/>',help:'<path d="M4 5h16v11H9l-5 4z"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const svg=k=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
const TABS=[['home','Главная'],['catalog','Каталог'],['orders','Заказы'],['topup','Пополнить']],TN={home:'Главная',catalog:'Каталог',orders:'Заказы',topup:'Пополнение'},MI={ym:'💳',bank:'🏦',crypto:'🪙'};
const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('ru-RU');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tg=window.Telegram&&Telegram.WebApp,U=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
try{tg.ready();tg.expand();tg.setHeaderColor('#070a10');tg.setBackgroundColor('#070a10');tg.disableVerticalSwipes&&tg.disableVerticalSwipes();tg.BackButton.onClick(()=>{closeSheet();closeHelp()})}catch(e){}
const hp=()=>{try{tg.HapticFeedback.impactOccurred('light')}catch(e){}},ok=()=>{try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}};
const cf=(m,fn)=>tg&&tg.showConfirm?tg.showConfirm(m,r=>r&&fn()):confirm(m)&&fn();

let cfg=JSON.parse(JSON.stringify(DEF)),S={bal:0,orders:[],promo:null,used:[]},admin=sessionStorage.getItem('adm')==='1',tab='home',cat=1,amt=5000,CP='';
try{S=JSON.parse(localStorage.getItem('ms3'))||S}catch(e){}S.used=S.used||[];
const saveS=()=>localStorage.setItem('ms3',JSON.stringify(S));
let cfgSaveT=0;
function saveCfg(){
 localStorage.setItem('cfg3',JSON.stringify(cfg));head();
 if(sb&&admin){clearTimeout(cfgSaveT);cfgSaveT=setTimeout(async()=>{
   const{error}=await sb.rpc('save_shop_config',{p_hash:ADMIN_TOKEN,p_data:cfg});
   if(error){console.error(error);toast('Не сохранилось на сервере: '+error.message)}
 },500)}
}
async function load(){
 let d=null;
 if(sb){try{const{data,error}=await sb.from('shop_config').select('data').eq('id','main').single();if(!error&&data)d=data.data}catch(e){}}
 if(!d){const ls=localStorage.getItem('cfg3');if(ls){try{d=JSON.parse(ls)}catch(e){}}else{try{const r=await fetch('config.json',{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}}}
 if(d)cfg=Object.assign(cfg,d);setTimeout(()=>snow(cfg.snow!==false),0);
 render();autoHelp();
 if(sb){setInterval(async()=>{if(admin)return;try{const{data,error}=await sb.from('shop_config').select('data').eq('id','main').single();if(!error&&data){cfg=Object.assign(cfg,data.data);render()}}catch(e){}},15000)}
}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2400)}
function go(t){tab=t;hp();render();autoHelp()}
function head(){document.title=cfg.name;$('nm').textContent=cfg.name;$('lg').textContent=(cfg.name||'M')[0];$('bal').textContent=fmt(S.bal);$('gear').style.display=admin?'flex':'none';$('gear').innerHTML=svg('gear')}
const fee=a=>a<cfg.freeFrom?Math.round(a*cfg.fee/100):0;
const tnote=()=>`Минимум ${fmt(cfg.minTop)} ₽ · от ${fmt(cfg.freeFrom)} ₽ без комиссии`+(fee(amt)?`<br>Комиссия ${cfg.fee}% — к оплате ${fmt(amt+fee(amt))} ₽`:'');
const hd=t=>`<div class="hd"><h2>${t}</h2><div class="info gl" onclick="help()">i</div></div>`;

function render(){
 head();
 if(!$('nav').firstChild)$('nav').innerHTML='<i class="lens"></i>'+TABS.map(([id,n])=>`<div data-t="${id}" onclick="go('${id}')">${svg(id)}${n}</div>`).join('');
 [...$('nav').children].forEach(e=>e.classList.toggle('on',e.dataset.t===tab));
 $('nav').querySelector('.lens').style.transform=`translateX(${TABS.findIndex(t=>t[0]===tab)*100}%)`;
 if(!cfg.cats.find(c=>c.id===cat)&&cfg.cats[0])cat=cfg.cats[0].id;
 const v=$('view');
 if(tab==='home')v.innerHTML=`<h1>Привет${U?', '+esc(U.first_name):''} 👋</h1><div class="mt">Выбирайте товар и оформляйте заказ в пару касаний</div>
  <div class="hero gl"><div class="mt">Ваш баланс</div><div class="big">${fmt(S.bal)} ₽</div><button class="btn" style="margin:0;width:auto;padding:12px 28px" onclick="go('topup')">Пополнить</button></div>
  <div class="sec">Быстрые действия</div><div class="qa">${[['catalog','Каталог',"go('catalog')"],['orders','Заказы',"go('orders')"],['topup','Пополнить',"go('topup')"],['help','Поддержка',"sup('')"]].map(([i,n,f],k)=>`<div class="q gl" style="animation-delay:${k*70}ms" onclick="${f}"><i>${svg(i)}</i>${n}</div>`).join('')}</div>`;
 if(tab==='catalog'){
  const list=cfg.products.filter(p=>p.cat===cat);
  v.innerHTML=hd('Каталог')+`<div class="mt">Всего товаров: ${cfg.products.length}</div>
  <div class="chips">${cfg.cats.map(c=>`<div class="chip gl ${c.id===cat?'on':''}" onclick="cat=${c.id};hp();render()"><b>${esc(c.name)}</b><small>${esc(c.sub)}</small>${admin&&c.id===cat?`<em onclick="event.stopPropagation();catForm(${c.id})">✎</em>`:''}</div>`).join('')}${admin?'<div class="chip gl" onclick="catForm(0)"><b>＋</b><small>Категория</small></div>':''}</div>`+
  (list.length?list.map((p,k)=>`<div class="card gl" style="animation-delay:${k*80}ms">${admin?`<div class="adm"><span onclick="prodForm(${p.id})">✎</span><span onclick="delP(${p.id})">✕</span></div>`:''}
   <h3 style="font-size:1.12rem;margin:0 0 14px;padding-right:${admin?70:0}px">${esc(p.name)}</h3><div class="g2"><div><div class="lb">${esc(cfg.statusLabel)}:</div><div class="gr">${esc(p.desc)}</div></div>${p.badge?`<div style="text-align:right"><div class="lb">${esc(cfg.badgeLabel)}:</div><span class="tag" style="display:inline-block;margin-top:6px">${esc(p.badge)}</span></div>`:''}</div>
   <div class="lb" style="margin-top:16px">Цена:</div><div class="pr" style="margin-top:2px">${fmt(p.price)} ₽</div>${cfg.guarantee?`<div class="gd">${svg('shield')}<span>${esc(cfg.guarantee)}</span></div>`:''}<button class="btn" onclick="buy(${p.id})">Купить</button></div>`).join(''):`<div class="empty">${svg('catalog')}<div>В этой категории пока пусто</div></div>`)+(admin?'<button class="btn g" onclick="prodForm(0)">+ Добавить товар</button>':'');
 }
 if(tab==='orders')v.innerHTML=hd('Заказы')+(S.orders.length?S.orders.slice().reverse().map(o=>`<div class="card gl"><div class="ph"><div class="tile">${esc(o.icon||'📦')}</div><div><h3>${esc(o.name)}</h3><p>${esc(o.date)}</p></div></div><div class="pf"><span class="tag">Выполнен</span><span class="pr">${fmt(o.price)} ₽</span></div></div>`).join(''):`<div class="empty">${svg('orders')}<div>Заказов пока нет</div></div>`)+
  `<div class="row2" style="margin-top:18px"><button class="btn g" onclick="go('catalog')">Посмотреть каталог</button><button class="btn g" onclick="go('topup')">Пополнить</button></div>`;
 if(tab==='topup')v.innerHTML=hd('Пополнение')+`<div class="mt">Выберите сумму и способ оплаты</div>
  <div class="amts">${[3000,5000,10000,20000,50000,100000].map(a=>`<div class="gl ${a===amt?'on':''}" onclick="amt=${a};hp();render()">${fmt(a)} ₽</div>`).join('')}</div>
  <div class="f" style="margin-top:6px"><label>Своя сумма</label><div class="sfx"><input type="number" inputmode="numeric" value="${amt}" oninput="amt=+this.value||0;$('tn').innerHTML=tnote()"></div></div>
  <div class="note" id="tn" style="text-align:center">${tnote()}</div>
  <div class="mth gl" style="margin-top:16px" onclick="promoSheet()"><div class="tile">🎟️</div><div class="t"><b>Промокод</b><small>${S.promo?'Активен '+esc(S.promo.code)+' · бонус +'+fmt(S.promo.bonus)+' ₽':'Введите код и получите бонус'}</small></div><span>›</span></div><div class="sec">Способ оплаты</div>${cfg.methods.map((m,k)=>`<div class="mth gl" style="animation-delay:${k*70}ms" onclick="pay(${m.id})"><div class="tile">${MI[m.type]||'💳'}</div><div class="t"><b>${esc(m.title)}</b><small>${esc(m.sub)}</small></div><span>›</span></div>`).join('')}<div class="note" style="text-align:center;margin-top:8px">Проверка зачисления занимает от 1 до 10 минут</div>`;
}
function buy(id){
 const p=cfg.products.find(x=>x.id===id);
 if(S.bal<p.price){toast('Недостаточно средств');go('topup');return}
 S.bal-=p.price;S.orders.push({name:p.name,price:p.price,icon:p.icon,date:new Date().toLocaleString('ru-RU')});saveS();ok();toast('Заказ оформлен ✔');go('orders');
}
// ---- оплата ----
function sup(msg){const u='https://t.me/'+String(cfg.support).replace('@','')+(msg?'?text='+encodeURIComponent(msg):'');tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u,'_blank')}
function copy(s){navigator.clipboard.writeText(s).then(()=>toast('Скопировано ✔')).catch(()=>toast(s))}
function pay(id){
 const m=cfg.methods.find(x=>x.id===id);
 if(amt<cfg.minTop)return toast('Минимум '+fmt(cfg.minTop)+' ₽');
 const total=amt+fee(amt),code='T'+(U?U.id:'web')+'-'+Date.now().toString(36).slice(-4).toUpperCase();
 const bonus=S.promo?S.promo.bonus:0,pc=S.promo?S.promo.code:'';
 if(cfg.demo){S.bal+=amt+bonus;usePromo();saveS();ok();toast('Тест: баланс пополнен на '+fmt(amt+bonus)+' ₽');render();return}
 if(m.type==='ym'){
  if(!cfg.wallet)return toast('Оплата картой пока не настроена');
  const u='https://yoomoney.ru/quickpay/confirm?'+new URLSearchParams({receiver:cfg.wallet,'quickpay-form':'shop',targets:'Пополнение баланса',paymentType:'AC',sum:total,label:code+(pc?'-'+pc:'')});
  tg&&tg.openLink?tg.openLink(u):window.open(u,'_blank');usePromo();return}
 CP=m.req;
 sheet(`<h2>${esc(m.title)}</h2><div class="mt">Переведите точную сумму и нажмите «Я оплатил(а)»</div>
  <div class="hero gl" style="margin-top:16px"><div class="mt">К оплате</div><div class="big" style="margin-bottom:6px">${fmt(total)} ₽</div><div class="note">Код платежа: <b>${code}</b> — укажите в комментарии</div>${bonus?`<div class="note" style="margin-top:6px">Промокод ${esc(pc)}: бонус +${fmt(bonus)} ₽ будет добавлен</div>`:''}</div>
  ${m.req?`<div class="cp gl" onclick="copy(CP)">${esc(m.req)}<div class="note" style="margin-top:8px;font-family:system-ui">Нажмите, чтобы скопировать</div></div>`:'<div class="cp gl">Реквизиты пока не указаны</div>'}
  ${m.note?`<div class="note">${esc(m.note).replace(/\n/g,'<br>')}</div>`:''}
  <div class="note" style="text-align:center;margin-top:10px">Проверка зачисления занимает от 1 до 10 минут</div><button class="btn" onclick="sup('Пополнение ${total} ₽ · ${esc(m.title)} · код ${code}${pc?' · промокод '+esc(pc):''}');usePromo();closeSheet()">Я оплатил(а)</button><button class="btn g" onclick="closeSheet()">Закрыть</button>`);
}
// ---- шторка и инструкции ----
function sheet(h){$('sh').innerHTML='<div class="grab"></div>'+h;$('bg').style.display='block';requestAnimationFrame(()=>$('sh').classList.add('on'));try{tg.BackButton.show()}catch(e){}}
function closeSheet(){$('sh').classList.remove('on');setTimeout(()=>$('bg').style.display='none',300);try{tg.BackButton.hide()}catch(e){}}
function help(t){t=t||tab;$('mb').innerHTML=`<h2 style="margin-bottom:4px">${TN[t]}</h2><div class="mt">Как это работает</div>`+(cfg.help[t]||'').split('\n').filter(Boolean).map((s,i)=>`<div class="stp"><b>${i+1}</b><span>${esc(s)}</span></div>`).join('')+`<button class="btn" onclick="closeHelp()">Понятно</button><button class="btn g" onclick="closeHelp();sup('')">Написать в поддержку</button>`;$('md').classList.add('on')}
function closeHelp(){$('md').classList.remove('on')}
function autoHelp(){const k='seen_'+tab;if(!localStorage.getItem(k)){localStorage.setItem(k,1);setTimeout(()=>help(),450)}}

// ---- скрытый вход: 6 касаний по лого ----
let ck=0,tm;$('lg').onclick=()=>{ck++;clearTimeout(tm);tm=setTimeout(()=>ck=0,2500);if(ck>=6){ck=0;hp();admin?adminSheet():loginSheet()}};
function loginSheet(){sheet(`<h2>Доступ администратора</h2><div class="mt">Введите логин и пароль</div>
 <div class="f"><label>Логин</label><input id="lgn" autocomplete="username" autocapitalize="none"></div>
 <div class="f"><label>Пароль</label><input id="pwd" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
 <div class="note" id="er" style="color:#fda4af;min-height:1.2em"></div><button class="btn" onclick="login()">Войти</button>`)}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){let h='';try{h=await sha($('lgn').value+':'+$('pwd').value)}catch(e){$('er').textContent='Нужен https';return}
 if(h===ADMIN_HASH){admin=true;ADMIN_TOKEN=h;sessionStorage.setItem('adm','1');sessionStorage.setItem('admtok',h);ok();render();adminSheet()}else $('er').textContent='Неверный логин или пароль'}
function logout(){admin=false;ADMIN_TOKEN='';sessionStorage.removeItem('adm');sessionStorage.removeItem('admtok');closeSheet();render()}

// ---- админ-панель ----
const row=(ic,t,s,e,d)=>`<div class="it gl"><div class="tile">${ic}</div><div class="t"><b>${esc(t)}</b><small>${esc(s)}</small></div><div class="adm" style="position:static"><span onclick="${e}">✎</span><span onclick="${d}">✕</span></div></div>`;
const txt=(l,k)=>`<div class="f"><label>${l}</label><input value="${esc(cfg[k])}" oninput="cfg.${k}=this.value;saveCfg()"></div>`;
const num=(l,k)=>`<div class="f"><label>${l}</label><input type="number" inputmode="numeric" value="${cfg[k]}" oninput="cfg.${k}=+this.value||0;saveCfg()"></div>`;
function adminSheet(){
 if(!admin)return;
 sheet(`<h2>Панель администратора</h2><div class="mt">Управление магазином</div>
 <div class="sec">Товары (${cfg.products.length})</div>${cfg.products.map(p=>row(esc(p.icon),p.name,fmt(p.price)+' ₽',`prodForm(${p.id})`,`delP(${p.id})`)).join('')}<button class="btn" onclick="prodForm(0)">+ Добавить товар</button>
 <div class="sec">Категории (кнопки каталога)</div>${cfg.cats.map(c=>row('🗂️',c.name,c.sub,`catForm(${c.id})`,`delC(${c.id})`)).join('')}<button class="btn g" onclick="catForm(0)">+ Добавить категорию</button>
 <div class="sec">Промокоды</div>${cfg.promos.map(p=>row('🎟️',p.code,'Бонус +'+fmt(p.bonus)+' ₽',`promoForm(${p.id})`,`delPr(${p.id})`)).join('')}<button class="btn g" onclick="promoForm(0)">+ Добавить промокод</button>
 <div class="sec">Способы пополнения</div>${cfg.methods.map(m=>row(MI[m.type]||'💳',m.title,m.sub,`methodForm(${m.id})`,`delM(${m.id})`)).join('')}<div class="row2"><button class="btn g" onclick="methodForm(0)">+ Способ</button><button class="btn g" onclick="methodForm(0,'crypto')">+ Криптокошелёк</button></div>
 <div class="sec">Магазин</div>
 <div class="f"><label>Название</label><input value="${esc(cfg.name)}" oninput="cfg.name=this.value;saveCfg()"></div>
 <div class="f"><label>Поддержка (@username)</label><input value="${esc(cfg.support)}" oninput="cfg.support=this.value;saveCfg()"></div>
 <div class="f"><label>Кошелёк ЮMoney (для оплаты картой)</label><input inputmode="numeric" placeholder="41001..." value="${esc(cfg.wallet)}" oninput="cfg.wallet=this.value.trim();saveCfg()"></div>
 ${num('Минимальное пополнение, ₽','minTop')}${num('Без комиссии от, ₽','freeFrom')}${num('Комиссия ниже порога, %','fee')}
 ${txt('Подпись «Статус» на карточке','statusLabel')}${txt('Подпись метки справа','badgeLabel')}${txt('Текст гарантии (пусто — скрыть)','guarantee')}<label class="sw"><span>Тестовое пополнение<br><small class="note">Зачисляет баланс сразу, без оплаты</small></span><input type="checkbox" ${cfg.demo?'checked':''} onchange="cfg.demo=this.checked;saveCfg()"><i></i></label>
 <label class="sw" style="margin-top:10px"><span>Снегопад<br><small class="note">Лёгкий снег на фоне</small></span><input type="checkbox" ${cfg.snow?'checked':''} onchange="cfg.snow=this.checked;saveCfg();snow(cfg.snow)"><i></i></label>
 <div class="sec">Тексты инструкций</div>${Object.keys(TN).map(k=>`<div class="f"><label>${TN[k]}</label><textarea oninput="cfg.help.${k}=this.value;saveCfg()">${esc(cfg.help[k])}</textarea></div>`).join('')}<div class="note">Каждая строка — отдельный шаг.</div>
 <div class="row2" style="margin-top:14px"><button class="btn g" onclick="exportCfg()">Скачать config.json</button><button class="btn g" onclick="resetCfg()">Сбросить</button></div>
 <button class="btn d" onclick="logout()">Выйти из админки</button>`)}
const gv=k=>$('ff-'+k).value.trim();
function form(t,fs,sv){sheet(`<h2>${t}</h2>`+fs.map(f=>`<div class="f"><label>${f.l}</label>`+(f.t==='ta'?`<textarea id="ff-${f.k}" placeholder="${f.p||''}">${esc(f.v)}</textarea>`:f.t==='sel'?`<select id="ff-${f.k}">${f.o.map(([v,n])=>`<option value="${esc(v)}" ${String(v)===String(f.v)?'selected':''}>${esc(n)}</option>`).join('')}</select>`:`<div class="${f.t==='num'?'sfx':''}"><input id="ff-${f.k}" ${f.t==='num'?'type="number" inputmode="numeric"':''} placeholder="${f.p||''}" value="${esc(f.v)}"></div>`)+(f.x||'')+'</div>').join('')+`<button class="btn" onclick="${sv}">Сохранить</button><button class="btn g" onclick="adminSheet()">Назад</button>`)}
function prodForm(id){
 const p=cfg.products.find(x=>x.id===id)||{name:'',desc:'',price:'',cat,icon:'📦'};
 form(id?'Редактировать товар':'Новый товар',[{k:'name',l:'Название',v:p.name,p:'Например, Neon Pack'},{k:'desc',l:'Статус / описание (показывается зелёным)',t:'ta',v:p.desc,p:'Коротко о товаре'},{k:'badge',l:'Метка справа (необязательно)',v:p.badge||'',p:'Например, 4K или WAV'},{k:'price',l:'Цена',t:'num',v:p.price,p:'0'},{k:'cat',l:'Категория',t:'sel',v:p.cat,o:cfg.cats.map(c=>[c.id,c.name])},
 {k:'icon',l:'Иконка',v:p.icon,x:`<div class="em">${['💾','🎧','🖥️','🎮','📚','🔑','🎨','⚡','🎬','🧩'].map(e=>`<span onclick="$('ff-icon').value='${e}'">${e}</span>`).join('')}</div>`}],`saveP(${id})`)}
function saveP(id){
 const n=gv('name'),pr=Math.round(+gv('price'));if(!n)return toast('Введите название');if(!(pr>0))return toast('Укажите цену');
 const p={id:id||Date.now(),name:n,desc:gv('desc'),price:pr,badge:gv('badge'),cat:+gv('cat'),icon:gv('icon')||'📦'};
 if(id)cfg.products[cfg.products.findIndex(x=>x.id===id)]=p;else cfg.products.push(p);
 saveCfg();ok();toast('Товар сохранён');adminSheet();render()}
function delP(id){cf('Удалить товар?',()=>{cfg.products=cfg.products.filter(x=>x.id!==id);saveCfg();render();if($('sh').classList.contains('on'))adminSheet()})}
function catForm(id){const c=cfg.cats.find(x=>x.id===id)||{name:'',sub:''};form(id?'Редактировать категорию':'Новая категория',[{k:'name',l:'Название кнопки',v:c.name,p:'Например, Софт'},{k:'sub',l:'Описание (мелким шрифтом в кнопке)',v:c.sub,p:'Ключи и плагины'}],`saveC(${id})`)}
function saveC(id){const n=gv('name');if(!n)return toast('Введите название');
 if(id){Object.assign(cfg.cats.find(x=>x.id===id),{name:n,sub:gv('sub')})}else{const c={id:Date.now(),name:n,sub:gv('sub')};cfg.cats.push(c);cat=c.id}
 saveCfg();ok();adminSheet();render()}
function delC(id){if(cfg.products.some(p=>p.cat===id))return toast('В категории есть товары');if(cfg.cats.length<2)return toast('Нужна хотя бы одна категория');cf('Удалить категорию?',()=>{cfg.cats=cfg.cats.filter(c=>c.id!==id);saveCfg();render();adminSheet()})}
function methodForm(id,t){const m=cfg.methods.find(x=>x.id===id)||{type:t||'bank',title:t==='crypto'?'USDT · TRC20':'',sub:t==='crypto'?'Криптовалюта':'',req:'',note:''};
 form(id?'Редактировать способ':'Новый способ',[{k:'type',l:'Тип',t:'sel',v:m.type,o:[['ym','Карта / ЮMoney'],['bank','Банковский перевод'],['crypto','Криптовалюта']]},{k:'title',l:'Название',v:m.title,p:'Банковский перевод'},{k:'sub',l:'Подпись',v:m.sub,p:'По реквизитам'},{k:'req',l:'Номер карты / счёта / адрес кошелька',v:m.req,p:'Реквизиты для перевода'},{k:'note',l:'Дополнительно (банк, получатель, сеть)',t:'ta',v:m.note}],`saveM(${id})`)}
function saveM(id){const t=gv('title');if(!t)return toast('Введите название');
 const m={id:id||Date.now(),type:gv('type'),title:t,sub:gv('sub'),req:gv('req'),note:gv('note')};
 if(id)cfg.methods[cfg.methods.findIndex(x=>x.id===id)]=m;else cfg.methods.push(m);saveCfg();ok();adminSheet();render()}
function delM(id){cf('Удалить способ?',()=>{cfg.methods=cfg.methods.filter(x=>x.id!==id);saveCfg();render();adminSheet()})}
// ---- промокоды ----
function usePromo(){if(S.promo){S.used.push(S.promo.code);S.promo=null;saveS()}}
function promoSheet(){sheet(`<h2>Промокод</h2><div class="mt">Введите код, чтобы получить бонус к пополнению</div>
 <div class="f"><label>Код</label><input id="pcode" autocapitalize="characters" autocomplete="off" placeholder="PROMO" value="${S.promo?esc(S.promo.code):''}" onkeydown="if(event.key==='Enter')applyPromo()"></div>
 <button class="btn" onclick="applyPromo()">Применить</button>${S.promo?'<button class="btn g" onclick="S.promo=null;saveS();closeSheet();render()">Убрать промокод</button>':''}`)}
function applyPromo(){const c=$('pcode').value.trim().toUpperCase(),p=cfg.promos.find(x=>x.code===c);
 if(!p)return toast('Промокод не найден');if(S.used.includes(c))return toast('Промокод уже использован');
 S.promo={code:c,bonus:p.bonus};saveS();ok();toast('Бонус +'+fmt(p.bonus)+' ₽ применён');closeSheet();render()}
function promoForm(id){const p=cfg.promos.find(x=>x.id===id)||{code:'',bonus:''};form(id?'Редактировать промокод':'Новый промокод',[{k:'code',l:'Промокод',v:p.code,p:'WELCOME'},{k:'bonus',l:'Сумма бонуса',t:'num',v:p.bonus,p:'0'}],`savePr(${id})`)}
function savePr(id){const c=gv('code').toUpperCase().replace(/[^A-Z0-9А-ЯЁ_-]/g,''),b=Math.round(+gv('bonus'));
 if(!c)return toast('Введите промокод');if(!(b>0))return toast('Укажите сумму бонуса');
 if(cfg.promos.some(x=>x.code===c&&x.id!==id))return toast('Такой код уже есть');
 const p={id:id||Date.now(),code:c,bonus:b};if(id)cfg.promos[cfg.promos.findIndex(x=>x.id===id)]=p;else cfg.promos.push(p);saveCfg();ok();adminSheet()}
function delPr(id){cf('Удалить промокод?',()=>{cfg.promos=cfg.promos.filter(x=>x.id!==id);saveCfg();adminSheet()})}
function resetCfg(){cf('Сбросить локальные изменения?',()=>{localStorage.removeItem('cfg3');location.reload()})}
function exportCfg(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}));a.download='config.json';a.click()}
// ---- снегопад: мелкие снежинки, их немного ----
let raf=0;
function snow(on){
 const c=$('snow'),x=c.getContext('2d');cancelAnimationFrame(raf);
 if(!on){x.clearRect(0,0,c.width,c.height);c.style.display='none';return}
 c.style.display='block';
 const d=Math.min(devicePixelRatio||1,2),W=c.width=innerWidth*d,H=c.height=innerHeight*d;
