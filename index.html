<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mini Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#070a10;--tx:#f2f6fb;--mt:rgba(235,242,255,.62);--ac:#6ff3dd;--ac2:#8b95ff;--bd:rgba(255,255,255,.17);--st:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font-family:-apple-system,"SF Pro Display",system-ui,Roboto,sans-serif;min-height:100vh;padding:var(--st) 18px 140px;overflow-x:hidden}
.au{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.au i{position:absolute;border-radius:50%;filter:blur(75px);opacity:.6;animation:fl 16s ease-in-out infinite alternate}
.au i:nth-child(1){width:380px;height:380px;background:#14b8a6;top:-110px;left:-120px}
.au i:nth-child(2){width:340px;height:340px;background:#6366f1;top:28%;right:-140px;animation-delay:-5s}
.au i:nth-child(3){width:360px;height:360px;background:#d946ef;bottom:-130px;left:5%;animation-delay:-9s;opacity:.45}
@keyframes fl{to{transform:translate(50px,70px) scale(1.18)}}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.98)}}
.gl{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 52%,rgba(255,255,255,.05));backdrop-filter:blur(18px) saturate(170%) brightness(1.05);-webkit-backdrop-filter:blur(18px) saturate(170%) brightness(1.05);
border:1px solid var(--bd);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 22px rgba(255,255,255,.03),0 12px 32px rgba(0,0,0,.20)}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650}
.lg{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;user-select:none;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 22px rgba(34,197,94,.35)}
.lg svg{width:100%;height:100%;display:block;stroke:none;fill:none}
.gear{display:none;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;cursor:pointer;color:var(--ac)}
.bal{padding:10px 17px;border-radius:99px;cursor:pointer}.bal b{color:var(--ac)}
h1{font-size:1.85rem;font-weight:700;margin:22px 0 6px}h2{font-size:1.45rem;font-weight:700;margin:0}
.hd{display:flex;align-items:center;justify-content:space-between;margin:22px 0 4px}
.info{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ac);font-weight:700}
.mt{color:var(--mt);font-size:.92rem}.note{font-size:.76rem;color:var(--mt);line-height:1.5}
.sec{font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--mt);margin:28px 0 12px}
.hero{position:relative;overflow:hidden;padding:24px;margin-top:18px;animation:up .5s both}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(111,243,221,.3),transparent 70%)}
.hero .big{font-size:2.6rem;font-weight:750;margin:6px 0 16px;letter-spacing:-1px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.q{padding:18px;cursor:pointer;animation:up .5s both;transition:transform .15s;font-weight:550}.q:active{transform:scale(.95)}
.q i{display:flex;width:46px;height:46px;border-radius:15px;align-items:center;justify-content:center;color:var(--ac);margin-bottom:12px;background:rgba(111,243,221,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.welcome{max-width:520px;margin:26px auto 6px;padding:22px 22px 24px;text-align:center;animation:up .6s both}
.welcome h3{margin:0 0 8px;font-size:1.15rem;font-weight:700}
.welcome p{margin:0;font-size:.92rem;color:var(--mt);line-height:1.5}
.welcome .wicon{width:54px;height:54px;margin:0 auto 12px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:rgba(111,243,221,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}

/* ===== КАТАЛОГ ===== */
.cat-title{text-align:center;font-size:1.5rem;font-weight:750;margin:24px 0 4px;line-height:1.2}
.cat-sub{text-align:center;color:var(--mt);font-size:.85rem;margin-bottom:22px}
.mode-label{font-size:.82rem;color:var(--mt);margin:14px 4px 10px}
.modebar{display:flex;align-items:center;justify-content:space-between;gap:0;padding:8px;border-radius:99px;position:relative;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.20);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 10px 28px rgba(0,0,0,.3)}
.modebar .mo{flex:1;text-align:center;padding:14px 6px;border-radius:99px;font-size:.92rem;font-weight:650;color:var(--mt);cursor:pointer;transition:.35s cubic-bezier(.3,1.35,.5,1);position:relative;z-index:1;white-space:nowrap}
.modebar .mo.on{color:#fff;background:linear-gradient(180deg,rgba(139,92,246,.55),rgba(139,92,246,.28));box-shadow:0 0 0 1px rgba(168,85,247,.7),0 0 26px rgba(168,85,247,.55),inset 0 1px 0 rgba(255,255,255,.55)}
.modebar .mo small{display:block;font-size:.66rem;font-weight:500;opacity:.85;margin-top:3px}
.cat-bar{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 14px;color:var(--mt);font-size:.9rem}
.cat-bar .arrs{display:flex;gap:16px;font-size:1.15rem;color:var(--mt)}

.accard{position:relative;padding:16px 18px;margin-bottom:14px;border-radius:22px;background:rgba(20,24,32,.75);border:1px solid rgba(255,255,255,.10);animation:up .5s both}
.accard *{box-sizing:border-box}
.accard .aname{font-size:1.02rem;font-weight:650;color:#fff;margin:0 0 14px}
.arow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.arow .lab{font-size:.86rem;color:var(--mt)}
.arow .gr{color:#6ee7a0;font-size:.92rem;font-weight:600;line-height:1.3;margin-top:4px;max-width:62%}
.arow .val{color:#60a5fa;font-weight:750;font-size:1.06rem;margin-top:4px}
.arow .val-r{color:#e5e7eb;font-weight:650;font-size:.92rem;margin-top:4px;text-align:right}
.splitpill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);font-size:.9rem;font-weight:600;color:#e5e7eb;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.splitpill .pac{width:20px;height:20px;flex:none;display:block}
.accard .adiv{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);margin:4px 0 14px}
.accard .cg{display:flex;align-items:center;gap:10px;color:#6ee7a0;font-size:.86rem}
.accard .cg svg{width:20px;height:20px;flex:none;stroke:#6ee7a0}
.statuspill{display:inline-flex;align-items:center;padding:7px 16px;border-radius:99px;font-size:.82rem;font-weight:600;color:#6ee7a0;background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.45);margin-top:6px}
.mpbadge{display:inline-flex;align-items:center;justify-content:center;width:52px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff2df0,#a020ff);font-weight:800;font-size:1.05rem;color:#fff;letter-spacing:-1px;padding:0 6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px rgba(168,85,247,.3)}
.accard .adm{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:2}
.accard .adm span{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:.8rem;cursor:pointer;color:#fff}

.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;font-size:.85rem;font-weight:700;color:var(--ac);background:rgba(111,243,221,.14);border:1px solid rgba(111,243,221,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(111,243,221,.15)}
.pill.click{cursor:pointer;transition:transform .15s}.pill.click:active{transform:scale(.95)}
.pill svg{width:16px;height:16px;stroke:var(--ac)}
.tag{padding:5px 13px;border-radius:99px;font-size:.76rem;background:rgba(255,255,255,.12);color:var(--mt)}
.order{position:relative;padding:16px 18px;margin-bottom:12px;animation:up .5s both}
.order .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:0;margin-bottom:8px}
.order .top h3{margin:0 0 4px;font-size:1.02rem}
.order .top .date{font-size:.76rem;color:var(--mt)}
.order .frow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.tile{flex:none;width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.75rem;background:linear-gradient(135deg,rgba(111,243,221,.22),rgba(139,149,255,.22));box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.btn{width:100%;border:1px solid rgba(255,255,255,.30);border-radius:20px;padding:15px;margin-top:12px;font:inherit;font-size:1rem;font-weight:650;cursor:pointer;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.25);
background:linear-gradient(180deg,rgba(111,243,221,.45),rgba(20,184,166,.22));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),0 8px 24px rgba(20,184,166,.22);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.g{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 22px rgba(0,0,0,.16)}
.btn.d{background:linear-gradient(180deg,rgba(251,113,133,.35),rgba(244,63,94,.12));border-color:rgba(251,113,133,.5)}
.btn.blue{background:linear-gradient(180deg,#3b82f6,#2563eb);border-color:rgba(96,165,250,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 22px rgba(37,99,235,.4)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mt);padding:44px 10px 10px}.empty svg{width:60px;height:60px;stroke-width:1.1;margin-bottom:10px}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.amts div{padding:16px 0;text-align:center;border-radius:20px;cursor:pointer;font-weight:650;transition:.25s}
.amts .on{background:linear-gradient(160deg,rgba(111,243,221,.30),rgba(111,243,221,.08));border-color:rgba(111,243,221,.6);color:#fff}
.mth{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer;animation:up .5s both;transition:transform .15s}.mth:active{transform:scale(.97)}
.mth .tile{width:48px;height:48px;font-size:1.4rem;border-radius:16px}.mth .t{flex:1}.mth .t b{display:block}.mth .t small{color:var(--mt);font-size:.78rem}.mth>span{color:var(--mt);font-size:1.4rem}
nav{position:fixed;left:18px;right:18px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;padding:6px;border-radius:38px;z-index:5}
nav .lens{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 14px rgba(255,255,255,.10),0 3px 12px rgba(0,0,0,.25);transition:transform .5s cubic-bezier(.3,1.35,.5,1)}
nav div{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;font-size:.62rem;color:var(--mt);cursor:pointer;transition:color .3s}
nav .on{color:#fff}nav .on svg{stroke:var(--ac)}
.help{position:fixed;right:20px;bottom:118px;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:1.25rem;z-index:4}
.toast{position:fixed;top:calc(var(--st) + 12px);left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:99px;display:none;z-index:40;font-size:.9rem}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;z-index:21;border-radius:32px 32px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03) 40%,rgba(255,255,255,.06));backdrop-filter:blur(32px) saturate(180%) brightness(.9);-webkit-backdrop-filter:blur(32px) saturate(180%) brightness(.9);border:1px solid var(--bd);border-bottom:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:none}.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.3);margin:4px auto 8px}.sheet h2{margin:8px 0 2px}
.md{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:25;padding:24px;background:rgba(0,0,0,.4);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.md.on{display:flex}
.mb{max-width:380px;width:100%;padding:22px;animation:pop .45s cubic-bezier(.2,1.2,.4,1);background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.05));max-height:85vh;overflow:auto}
@keyframes pop{from{opacity:0;transform:scale(.82)}}
.stp{display:flex;gap:12px;margin:13px 0;font-size:.93rem;line-height:1.45}.stp b{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(111,243,221,.22);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:.8rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.f{margin:16px 0}.f label{display:block;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--mt);margin:0 0 8px 4px}
.f input,.f textarea,.f select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:18px;padding:14px 16px;color:var(--tx);font:inherit;font-size:16px;outline:0;transition:.25s;appearance:none;box-shadow:inset 0 2px 8px rgba(0,0,0,.15)}
.f select option{color:#000}.f textarea{resize:none;min-height:84px}
.f input:focus,.f textarea:focus,.f select:focus{border-color:rgba(111,243,221,.7);box-shadow:0 0 0 4px rgba(111,243,221,.15),inset 0 2px 8px rgba(0,0,0,.15);background:rgba(255,255,255,.10)}

/* ==== КРАСИВОЕ ПОЛЕ СУММЫ ==== */
.money{position:relative;display:flex;align-items:center;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:0 14px;transition:.2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.15)}
.money:focus-within{border-color:rgba(96,165,250,.8);box-shadow:0 0 0 4px rgba(59,130,246,.15),inset 0 1px 0 rgba(255,255,255,.15),0 4px 14px rgba(0,0,0,.15);background:linear-gradient(180deg,rgba(59,130,246,.10),rgba(59,130,246,.04))}
.money input{flex:1;width:100%;background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:1.5rem;font-weight:750;padding:16px 4px;letter-spacing:-.5px}
.money input::-webkit-outer-spin-button,.money input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.money input[type=number]{-moz-appearance:textfield}
.money .suf{font-size:1.4rem;font-weight:700;color:#93c5fd;padding-left:6px;pointer-events:none}

.it{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;border-radius:20px}
.it .t{flex:1;min-width:0}.it .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .t small{color:var(--mt)}.it .tile{width:44px;height:44px;font-size:1.3rem;border-radius:14px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:6px 4px}.sw input{display:none}
.sw i{position:relative;flex:none;width:54px;height:31px;border-radius:99px;background:rgba(255,255,255,.18);transition:.3s;box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sw input:checked+i{background:var(--ac)}.sw input:checked+i::after{transform:translateX(23px)}
.cp{padding:16px;margin:14px 0;word-break:break-all;font-family:ui-monospace,Menlo,monospace;cursor:pointer;text-align:center}
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.lb{font-size:.82rem;color:var(--mt)}.gr{color:#6ee7a0;font-weight:550;margin-top:6px;line-height:1.35}
.detail-row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px dashed rgba(255,255,255,.10);font-size:.9rem}
.detail-row:last-child{border-bottom:0}
.detail-row .k{color:var(--mt);flex:none}
.detail-row .v{text-align:right;word-break:break-word;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:.84rem;color:#fff}
.detail-block{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--bd);margin:10px 0}
.detail-block .t{font-size:.72rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--mt);margin-bottom:8px}
.detail-block .b{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,monospace;font-size:.85rem;line-height:1.5}

/* ===== ЭКРАН ПОПОЛНЕНИЯ ===== */
.top-hero{font-size:1.55rem;font-weight:750;margin:6px 0 4px}
.top-hero small{display:block;font-size:.85rem;font-weight:400;color:var(--mt);margin-top:4px}
.pcard{padding:0;margin-bottom:14px;border-radius:22px;background:rgba(20,24,32,.75);border:1px solid rgba(255,255,255,.10);overflow:hidden}
.pcard-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);font-size:1.02rem;font-weight:650}
.pcard-h i{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-style:normal;background:rgba(59,130,246,.18);color:#60a5fa;font-size:.85rem}
.pcard-b{padding:16px 18px}
.mini-label{font-size:.85rem;color:var(--mt);margin:0 0 10px 2px}
.amts2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.amts2 div{padding:13px 0;text-align:center;border-radius:14px;cursor:pointer;font-size:.9rem;font-weight:600;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);color:#e5e7eb;transition:.2s}
.amts2 div.on{background:rgba(59,130,246,.18);border-color:rgba(96,165,250,.7);color:#fff}
.payopt{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);margin-bottom:10px;cursor:pointer;transition:.2s}
.payopt.on{background:rgba(59,130,246,.10);border-color:rgba(96,165,250,.7);box-shadow:0 0 0 1px rgba(96,165,250,.4) inset}
.payopt .ic{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(59,130,246,.22);color:#bfdbfe;font-size:1.1rem}
.payopt .t{flex:1;min-width:0}
.payopt .t b{font-size:1rem;font-weight:650;color:#fff;display:flex;align-items:center;gap:8px}
.payopt .t small{color:var(--mt);font-size:.78rem;display:block;margin-top:2px}
.payopt .chk{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:transparent;font-size:.75rem;font-weight:900}
.payopt.on .chk{border-color:#3b82f6;background:#3b82f6;color:#fff}
.pay-tip{display:flex;align-items:center;gap:8px;justify-content:center;padding:12px;color:var(--mt);font-size:.82rem}
.pay-tip b{color:#93c5fd;font-weight:600}
.greenbadge{padding:3px 9px;border-radius:99px;background:rgba(34,197,94,.18);color:#6ee7a0;font-size:.68rem;font-weight:700;border:1px solid rgba(34,197,94,.35)}
.footer-note{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mt);font-size:.76rem;margin-top:12px}
.footer-note svg{width:14px;height:14px;stroke:var(--mt)}

/* ===== ПУСТОЙ ЭКРАН ЗАКАЗОВ ===== */

  <div class="hero gl" style="margin-top:16px"><div class="mt">К оплате</div><div class="big" style="margin-bottom:6px">${fmt(total)} ₽</div><div class="note">Код платежа: <b>${code}</b> — укажите в комментарии</div>${bonus?`<div class="note" style="margin-top:6px">Промокод ${esc(pc)}: бонус +${fmt(bonus)} ₽ будет добавлен</div>`:''}</div>
  ${CP?`<div class="cp gl" onclick="copy(CP)">${esc(CP)}<div class="note" style="margin-top:8px;font-family:system-ui">Нажмите, чтобы скопировать</div></div>`:'<div class="cp gl">Реквизиты пока не указаны</div>'}
  ${m.note?`<div class="note">${esc(m.note).replace(/\n/g,'<br>')}</div>`:''}
  <div class="note" style="text-align:center;margin-top:10px">Проверка зачисления занимает от 1 до 10 минут</div><button class="btn" onclick="sup('Пополнение ${total} ₽ · ${esc(m.title)} · код ${code}${pc?' · промокод '+esc(pc):''}');usePromo();closeSheet()">Я оплатил(а)</button><button class="btn g" onclick="closeSheet()">Закрыть</button>`);

function sheet(h){$('sh').innerHTML='<div class="grab"></div>'+h;$('bg').style.display='block';requestAnimationFrame(()=>$('sh').classList.add('on'));try{tg.BackButton.show()}catch(e){}}
function closeSheet(){$('sh').classList.remove('on');setTimeout(()=>$('bg').style.display='none',300);try{tg.BackButton.hide()}catch(e){}}
function help(t){t=t||tab;$('mb').innerHTML=`<h2 style="margin-bottom:4px">${TN[t]}</h2><div class="mt">Как это работает</div>`+(cfg.help[t]||'').split('\n').filter(Boolean).map((s,i)=>`<div class="stp"><b>${i+1}</b><span>${esc(s)}</span></div>`).join('')+`<button class="btn" onclick="closeHelp()">Понятно</button><button class="btn g" onclick="closeHelp();sup('')">Написать в поддержку</button>`;$('md').classList.add('on')}
function closeHelp(){$('md').classList.remove('on')}
function autoHelp(){const k='seen_'+tab;if(!localStorage.getItem(k)){localStorage.setItem(k,1);setTimeout(()=>help(),450)}}

let ck=0,tm;$('lg').onclick=()=>{ck++;clearTimeout(tm);tm=setTimeout(()=>ck=0,2500);if(ck>=6){ck=0;hp();admin?adminSheet():loginSheet()}};
function loginSheet(){sheet(`<h2>Доступ администратора</h2><div class="mt">Введите логин и пароль</div>
 <div class="f"><label>Логин</label><input id="lgn" autocomplete="username" autocapitalize="none"></div>
 <div class="f"><label>Пароль</label><input id="pwd" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
 <div class="note" id="er" style="color:#fda4af;min-height:1.2em"></div><button class="btn" onclick="login()">Войти</button>`)}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){let h='';try{h=await sha($('lgn').value+':'+$('pwd').value)}catch(e){$('er').textContent='Нужен https';return}
 if(h===ADMIN_HASH){admin=true;sessionStorage.setItem('adm','1');ok();render();adminSheet()}else $('er').textContent='Неверный логин или пароль'}
function logout(){admin=false;sessionStorage.removeItem('adm');closeSheet();render()}

const row=(ic,t,s,e,d)=>`<div class="it gl"><div class="tile">${ic}</div><div class="t"><b>${esc(t)}</b><small>${esc(s)}</small></div><div class="adm" style="position:static"><span onclick="${e}">✎</span><span onclick="${d}">✕</span></div></div>`;
const txt=(l,k)=>`<div class="f"><label>${l}</label><input value="${esc(cfg[k])}" oninput="cfg.${k}=this.value;saveCfg()"></div>`;
const num=(l,k)=>`<div class="f"><label>${l}</label><input type="number" inputmode="numeric" value="${cfg[k]}" oninput="cfg.${k}=+this.value||0;saveCfg()"></div>`;
function adminSheet(){
 if(!admin)return;
 sheet(`<h2>Панель администратора</h2><div class="mt">Управление магазином</div>
 <div class="sec">Товары (${cfg.products.length})</div>${cfg.products.map(p=>row('👤',p.name,fmt(p.price)+' ₽',`prodForm(${p.id})`,`delP(${p.id})`)).join('')}<button class="btn" onclick="prodForm(0)">+ Добавить товар</button>
 <div class="sec">Категории</div>${cfg.cats.map(c=>row('🗂️',c.name,c.sub,`catForm(${c.id})`,`delC(${c.id})`)).join('')}<button class="btn g" onclick="catForm(0)">+ Добавить категорию</button>
 <div class="sec">Промокоды</div>${cfg.promos.map(p=>row('🎟️',p.code,'Бонус +'+fmt(p.bonus)+' ₽',`promoForm(${p.id})`,`delPr(${p.id})`)).join('')}<button class="btn g" onclick="promoForm(0)">+ Добавить промокод</button>
 <div class="sec">Способы пополнения</div>${cfg.methods.map(m=>row(MI[m.type]||'💳',m.title,m.sub,`methodForm(${m.id})`,`delM(${m.id})`)).join('')}<div class="row2"><button class="btn g" onclick="methodForm(0)">+ Способ</button><button class="btn g" onclick="methodForm(0,'crypto')">+ Криптокошелёк</button></div>
 <div class="sec">Прогрев · сервисы</div>${cfg.prep.services.map(s=>row('🔗',s.name,'мин '+s.min+' · тек '+s.count,`svcForm('${s.id}')`,`delSvc('${s.id}')`)).join('')}<button class="btn g" onclick="svcForm('')">+ Добавить сервис</button>
 <div class="sec">Прогрев · метрики фермы</div>${cfg.prep.metrics.map(m=>row('📈',m.name,'сейчас '+m.val+m.suffix+' · мин '+m.min,`metForm('${m.id}')`,`delMet('${m.id}')`)).join('')}<button class="btn g" onclick="metForm('')">+ Добавить метрику</button>
 <div class="f"><label>Города (через запятую)</label><textarea oninput="cfg.prep.cities=this.value.split(',').map(s=>s.trim()).filter(Boolean);saveCfg()">${esc(cfg.prep.cities.join(', '))}</textarea></div>
 <div class="f"><label>Интервал обновления, мс</label><input type="number" value="${cfg.prep.feed.interval||1000}" oninput="cfg.prep.feed.interval=+this.value||1000;saveCfg()"></div>
 <div class="sec">Режим работы (вкладки в каталоге)</div>
 <div class="f"><label>Варианты через запятую</label><input value="${esc((cfg.modeOptions||[]).join(', '))}" oninput="cfg.modeOptions=this.value.split(',').map(s=>s.trim()).filter(Boolean);saveCfg()"></div>
 <div class="sec">Магазин</div>
 <div class="f"><label>Название</label><input value="${esc(cfg.name)}" oninput="cfg.name=this.value;saveCfg()"></div>
 <div class="f"><label>Поддержка (@username)</label><input value="${esc(cfg.support)}" oninput="cfg.support=this.value;saveCfg()"></div>

 <label class="sw"><span>Тестовое пополнение<br><small class="note">Зачисляет баланс сразу</small></span><input type="checkbox" ${cfg.demo?'checked':''} onchange="cfg.demo=this.checked;saveCfg()"><i></i></label>
 <label class="sw" style="margin-top:10px"><span>Частицы на фоне<br><small class="note">Разноцветные точки</small></span><input type="checkbox" ${cfg.snow?'checked':''} onchange="cfg.snow=this.checked;saveCfg();snow(cfg.snow)"><i></i></label>
 <div class="sec">Приветствие на главной</div>
 <div class="f"><label>Заголовок</label><input value="${esc(cfg.welcome.title)}" oninput="cfg.welcome.title=this.value;saveCfg()"></div>
 <div class="f"><label>Текст</label><textarea oninput="cfg.welcome.text=this.value;saveCfg()">${esc(cfg.welcome.text)}</textarea></div>
 <div class="row2" style="margin-top:14px"><button class="btn g" onclick="exportCfg()">Скачать config.json</button><button class="btn g" onclick="resetCfg()">Сбросить</button></div>
 <button class="btn d" onclick="logout()">Выйти из админки</button>`)}
const gv=k=>$('ff-'+k).value.trim();
function form(t,fs,sv){sheet(`<h2>${t}</h2>`+fs.map(f=>`<div class="f"><label>${f.l}</label>`+(f.t==='ta'?`<textarea id="ff-${f.k}" placeholder="${f.p||''}">${esc(f.v)}</textarea>`:f.t==='sel'?`<select id="ff-${f.k}">${f.o.map(([v,n])=>`<option value="${esc(v)}" ${String(v)===String(f.v)?'selected':''}>${esc(n)}</option>`).join('')}</select>`:`<div class="${f.t==='num'?'sfx':''}"><input id="ff-${f.k}" ${f.t==='num'?'type="number" inputmode="numeric"':''} placeholder="${f.p||''}" value="${esc(f.v)}"></div>`)+(f.x||'')+'</div>').join('')+`<button class="btn" onclick="${sv}">Сохранить</button><button class="btn g" onclick="adminSheet()">Назад</button>`)}
function prodForm(id){
 const p=cfg.products.find(x=>x.id===id)||{name:'',desc:'',price:'',cat,type:'A',split:'200 000 RUB',marketplace:'WB',limit:'200 000 RUB',details:''};
 form(id?'Редактировать товар':'Новый товар',[
   {k:'name',l:'Название',v:p.name,p:'Аккаунт #A-1024'},
   {k:'type',l:'Тип карточки',t:'sel',v:p.type||'A',o:[['A','Вариант A (Статус + Сплит + Цена)'],['B','Вариант B (Маркетплейс + Лимит + Цена)']]},
   {k:'desc',l:'Статус (зелёный текст)',t:'ta',v:p.desc,p:'Готов к заказу - пассивный прогрев'},
   {k:'price',l:'Цена (₽)',t:'num',v:p.price,p:'0'},
   {k:'split',l:'Сплит (для варианта A)',v:p.split||'200 000 RUB',p:'200 000 RUB'},
   {k:'marketplace',l:'Маркетплейс (для варианта B)',v:p.marketplace||'WB',p:'WB'},
   {k:'limit',l:'Лимит (для варианта B)',v:p.limit||'200 000 RUB',p:'200 000 RUB'},
   {k:'cat',l:'Категория',t:'sel',v:p.cat,o:cfg.cats.map(c=>[c.id,c.name])},
   {k:'details',l:'Данные товара (показываются в «Подробно»)',t:'ta',v:p.details||'',p:'Логин: ...\nПароль: ...'}
 ],`saveP(${id})`)}
function saveP(id){
 const n=gv('name'),pr=Math.round(+gv('price'));if(!n)return toast('Введите название');if(!(pr>0))return toast('Укажите цену');
 const p={id:id||Date.now(),name:n,desc:gv('desc'),price:pr,type:gv('type'),badge:'',cat:+gv('cat'),details:gv('details'),split:gv('split')||'200 000 RUB',marketplace:gv('marketplace')||'WB',limit:gv('limit')||'200 000 RUB'};
 if(id)cfg.products[cfg.products.findIndex(x=>x.id===id)]=p;else cfg.products.push(p);
 saveCfg();ok();toast('Товар сохранён');adminSheet();render()}
function delP(id){cf('Удалить товар?',()=>{cfg.products=cfg.products.filter(x=>x.id!==id);saveCfg();render();if($('sh').classList.contains('on'))adminSheet()})}
function catForm(id){const c=cfg.cats.find(x=>x.id===id)||{name:'',sub:''};form(id?'Редактировать категорию':'Новая категория',[{k:'name',l:'Название кнопки',v:c.name,p:'Например, Аккаунты'},{k:'sub',l:'Описание',v:c.sub,p:'Готовые к работе'}],`saveC(${id})`)}
function saveC(id){const n=gv('name');if(!n)return toast('Введите название');
 if(id){Object.assign(cfg.cats.find(x=>x.id===id),{name:n,sub:gv('sub')})}else{const c={id:Date.now(),name:n,sub:gv('sub')};cfg.cats.push(c);cat=c.id}
 saveCfg();ok();adminSheet();render()}
function delC(id){if(cfg.products.some(p=>p.cat===id))return toast('В категории есть товары');if(cfg.cats.length<2)return toast('Нужна хотя бы одна категория');cf('Удалить категорию?',()=>{cfg.cats=cfg.cats.filter(c=>c.id!==id);saveCfg();render();adminSheet()})}
function methodForm(id,t){const m=cfg.methods.find(x=>x.id===id)||{type:t||'bank',title:t==='crypto'?'Crypto':'Банковский перевод',sub:t==='crypto'?'Мгновенно':'10% · 5-20 мин',req:'',note:''};
 form(id?'Редактировать способ':'Новый способ',[{k:'type',l:'Тип',t:'sel',v:m.type,o:[['bank','Банковский перевод'],['crypto','Криптовалюта'],['ym','Карта / ЮMoney']]},{k:'title',l:'Название',v:m.title},{k:'sub',l:'Подпись',v:m.sub},{k:'req',l:'Реквизиты',v:m.req},{k:'note',l:'Дополнительно',t:'ta',v:m.note}],`saveM(${id})`)}
function saveM(id){const t=gv('title');if(!t)return toast('Введите название');
 const m={id:id||Date.now(),type:gv('type'),title:t,sub:gv('sub'),req:gv('req'),note:gv('note')};
 if(id)cfg.methods[cfg.methods.findIndex(x=>x.id===id)]=m;else cfg.methods.push(m);saveCfg();ok();adminSheet();render()}
function delM(id){cf('Удалить способ?',()=>{cfg.methods=cfg.methods.filter(x=>x.id!==id);saveCfg();render();adminSheet()})}
function svcForm(id){
 const s=cfg.prep.services.find(x=>x.id===id)||{name:'',count:100,min:50};
 form(id?'Сервис':'Новый сервис',[{k:'name',l:'Название',v:s.name,p:'Яндекс Почта'},{k:'min',l:'Минимум подкл.',t:'num',v:s.min},{k:'count',l:'Стартовое значение',t:'num',v:s.count}],`saveSvc('${id}')`);
}
function saveSvc(id){
 const name=gv('name'),min=Math.max(0,Math.round(+gv('min'))||0),count=Math.max(min,Math.round(+gv('count'))||min);
 if(!name)return toast('Введите название');
 if(id){const s=cfg.prep.services.find(x=>x.id===id);Object.assign(s,{name,min,count})}
 else cfg.prep.services.push({id:'s'+Date.now(),name,min,count});
 saveCfg();ok();adminSheet();render();
}
function delSvc(id){cf('Удалить сервис?',()=>{cfg.prep.services=cfg.prep.services.filter(x=>x.id!==id);saveCfg();adminSheet();render()})}
function metForm(id){
 const m=cfg.prep.metrics.find(x=>x.id===id)||{name:'',val:50,min:20,suffix:'%',max:100};
 form(id?'Метрика':'Новая метрика',[{k:'name',l:'Название',v:m.name,p:'avg CPU Load'},{k:'val',l:'Стартовое значение',t:'num',v:m.val},{k:'min',l:'Минимум',t:'num',v:m.min},{k:'max',l:'Максимум',t:'num',v:m.max},{k:'suffix',l:'Суффикс',v:m.suffix,p:'% / °C / MB/s'}],`saveMet('${id}')`);
}
function saveMet(id){
 const name=gv('name');if(!name)return toast('Введите название');
 const val=Number(gv('val'))||0,min=Number(gv('min'))||0,max=Math.max(min+1,Number(gv('max'))||100),suffix=gv('suffix')||'';
 if(id){const m=cfg.prep.metrics.find(x=>x.id===id);Object.assign(m,{name,val,min,max,suffix})}
 else cfg.prep.metrics.push({id:'m'+Date.now(),name,val,min,max,suffix});
 saveCfg();ok();adminSheet();render();
}
function delMet(id){cf('Удалить метрику?',()=>{cfg.prep.metrics=cfg.prep.metrics.filter(x=>x.id!==id);saveCfg();adminSheet();render()})}
function usePromo(){if(S.promo){S.used.push(S.promo.code);S.promo=null;saveS()}}
function promoSheet(){sheet(`<h2>Промокод</h2><div class="mt">Введите код, чтобы получить бонус</div>
 <div class="f"><label>Код</label><input id="pcode" autocapitalize="characters" autocomplete="off" placeholder="PROMO" value="${S.promo?esc(S.promo.code):''}" onkeydown="if(event.key==='Enter')applyPromo()"></div>
 <button class="btn" onclick="applyPromo()">Применить</button>${S.promo?'<button class="btn g" onclick="S.promo=null;saveS();closeSheet();render()">Убрать промокод</button>':''}`)}
function applyPromo(){const c=$('pcode').value.trim().toUpperCase(),p=cfg.promos.find(x=>x.code===c);
 if(!p)return toast('Промокод не найден');if(S.used.includes(c))return toast('Промокод уже использован');
 S.promo={code:c,bonus:p.bonus};saveS();ok();toast('Бонус +'+fmt(p.bonus)+' ₽ применён');closeSheet();render()}
function promoForm(id){const p=cfg.promos.find(x=>x.id===id)||{code:'',bonus:''};form(id?'Редактировать промокод':'Новый промокод',[{k:'code',l:'Промокод',v:p.code,p:'WELCOME'},{k:'bonus',l:'Сумма бонуса',t:'num',v:p.bonus,p:'0'}],`savePr(${id})`)}
function savePr(id){const c=gv('code').toUpperCase().replace(/[^A-Z0-9А-ЯЁ_-]/g,''),b=Math.round(+gv('bonus'));
 if(!c)return toast('Введите промокод');if(!(b>0))return toast('Укажите сумму бонуса');
 if(cfg.promos.some(x=>x.code===c&&x.id!==id))return toast('Такой код уже есть');
 const p={id:id||Date.now(),code:c,bonus:b};if(id)cfg.promos[cfg.promos.findIndex(x=>x.id===id)]=p;else cfg.promos.push(p);saveCfg();ok();adminSheet()}
function delPr(id){cf('Удалить промокод?',()=>{cfg.promos=cfg.promos.filter(x=>x.id!==id);saveCfg();adminSheet()})}
function resetCfg(){cf('Сбросить локальные изменения?',()=>{localStorage.removeItem('cfg3');location.reload()})}
function exportCfg(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}));a.download='config.json';a.click()}

let raf=0;
function snow(on){
 const c=$('snow'),x=c.getContext('2d');cancelAnimationFrame(raf);
 if(!on){x.clearRect(0,0,c.width,c.height);c.style.display='none';return}
 c.style.display='block';
 const d=Math.min(devicePixelRatio||1,2),W=c.width=innerWidth*d,H=c.height=innerHeight*d;
 const colors=['#6ff3dd','#8b95ff','#fda4af','#fcd34d','#a7f3d0','#c084fc','#67e8f9','#f0abfc','#fdba74','#86efac'];
 const N=120;
 const fl=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,r:(1+Math.random()*4)*d,vx:(Math.random()-0.5)*0.9*d,vy:(Math.random()-0.5)*0.9*d,color:colors[Math.floor(Math.random()*colors.length)],alpha:0.4+Math.random()*0.6,pulse:Math.random()*6.28,pulseSpeed:0.01+Math.random()*0.03}));
 (function f(){x.clearRect(0,0,W,H);
   for(const p of fl){p.x+=p.vx;p.y+=p.vy;p.pulse+=p.pulseSpeed;
     const a=p.alpha*(0.7+0.3*Math.sin(p.pulse));
     if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;
     x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle=p.color;x.globalAlpha=a;x.fill();
     x.globalAlpha=a*0.3;x.beginPath();x.arc(p.x,p.y,p.r*1.8,0,6.283);x.fillStyle=p.color;x.fill();
   }
   x.globalAlpha=1;raf=requestAnimationFrame(f);
 })();
}
addEventListener('resize',()=>snow(cfg.snow!==false));
load();
