<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windows 10 Web</title>
<style>
:root{--acc:#0078d7;--bg:#f3f3f3;--fg:#111;--win:#fff;--bd:#cfcfcf;--hov:rgba(0,0,0,.08)}
:root[data-theme=dark]{--bg:#2b2b2b;--fg:#eee;--win:#202020;--bd:#444;--hov:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font:13px "Segoe UI",system-ui,sans-serif;color:var(--fg);user-select:none;background:#000}
#desk{position:fixed;inset:0 0 40px 0;overflow:hidden;background-size:cover}
#icons{position:absolute;inset:0;padding:8px;display:flex;flex-flow:column wrap;align-content:flex-start;gap:4px;height:100%}
.ic{width:80px;padding:6px 2px;text-align:center;color:#fff;text-shadow:0 1px 3px #000;border:1px solid transparent;border-radius:3px;cursor:default}
.ic:hover,.ic.s{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35)}
.ic b{display:block;font-size:32px;font-weight:400}
.win{position:absolute;display:none;flex-direction:column;background:var(--win);border:1px solid var(--acc);box-shadow:0 8px 30px rgba(0,0,0,.45);resize:both;overflow:hidden;min-width:220px;min-height:140px;max-width:100%}
.win.f{box-shadow:0 12px 40px rgba(0,0,0,.6)}
.win.max{inset:0 !important;width:auto !important;height:auto !important;resize:none}
.tb{display:flex;justify-content:space-between;align-items:center;height:32px;background:var(--win);padding-left:8px;cursor:default;flex:none}
.win.f .tb{border-bottom:1px solid var(--acc)}
.bt{display:flex;height:100%}.bt i{width:46px;display:grid;place-items:center;font-style:normal}
.bt i:hover{background:var(--hov)}.bt i.cl:hover{background:#e81123;color:#fff}
.bd{flex:1;min-height:0;overflow:auto;background:var(--bg)}
#tbar{position:fixed;left:0;right:0;bottom:0;height:40px;background:rgba(18,18,18,.94);display:flex;color:#fff;z-index:99999;padding-bottom:env(safe-area-inset-bottom,0px)}
#tbar>*{height:40px;display:flex;align-items:center}
.tbn{min-width:46px;justify-content:center;font-size:18px;position:relative;padding:0 8px;cursor:default}
.tbn:hover{background:rgba(255,255,255,.15)}.tbn.on:after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:3px;background:#76b9ed}
.tbn.fc{background:rgba(255,255,255,.22)}
#srch{background:#fff;color:#555;width:200px;margin:0 6px;padding:0 10px;height:30px !important;font-size:13px}
#clock{margin-left:auto;padding:0 12px;text-align:center;font-size:12px;line-height:1.2;display:block !important;padding-top:5px}
#start{position:fixed;left:0;bottom:40px;width:300px;height:420px;max-height:calc(100% - 40px);background:rgba(25,25,25,.96);color:#fff;z-index:99998;display:none;flex-direction:column}
#start.o{display:flex}#start .l{flex:1;overflow:auto;padding:8px 0}
#start .it{padding:10px 16px;display:flex;gap:12px;align-items:center;font-size:14px}.it:hover{background:rgba(255,255,255,.15)}
#cm{position:fixed;display:none;background:var(--win);color:var(--fg);border:1px solid var(--bd);box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:100000;min-width:200px;padding:3px 0}
#cm div{padding:6px 24px}#cm div:hover{background:var(--acc);color:#fff}
button,input,select,textarea{font:inherit;color:var(--fg);background:var(--win);border:1px solid var(--bd);padding:4px 8px}
button:hover{background:var(--hov)}
.ex{display:flex;height:100%}.nav{width:150px;border-right:1px solid var(--bd);padding:6px 0;flex:none}
.nav div{padding:6px 12px}.nav div:hover,.fi:hover{background:var(--hov)}.nav .sel{background:var(--hov);border-left:3px solid var(--acc)}
.fl{flex:1;overflow:auto}.path{padding:8px 12px;border-bottom:1px solid var(--bd)}
.fi{padding:6px 12px;display:flex;gap:8px;align-items:center}.fi small{margin-left:auto;opacity:.6}.fi u{text-decoration:none;opacity:.5}
.em{padding:20px;opacity:.6}
.np2{display:flex;flex-direction:column;height:100%}.np2 .t{display:flex;gap:4px;padding:4px;flex:none}.np2 textarea{flex:1;border:0;resize:none;outline:0;font:14px Consolas,monospace;user-select:text}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:4px;height:100%;grid-template-rows:70px repeat(5,1fr)}
.cal .d{grid-column:1/5;text-align:right;font-size:32px;padding:10px}.cal button{font-size:18px}
.set{padding:16px}.set h3{margin:14px 0 8px;font-weight:600}.sw{display:inline-block;width:34px;height:34px;margin:0 6px 6px 0;border:2px solid transparent;vertical-align:middle}
.br{display:flex;flex-direction:column;height:100%;background:var(--win)}
.tabs{display:flex;background:var(--bd);padding:6px 6px 0;gap:2px;flex:none;overflow-x:auto}
.tab{background:rgba(128,128,128,.25);padding:6px 10px;border-radius:8px 8px 0 0;min-width:110px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;justify-content:space-between}
.tab.a{background:var(--win)}.tab u{text-decoration:none;opacity:.6}
.nv{display:flex;gap:4px;padding:5px;flex:none}.nv .url{flex:1;border-radius:16px;padding:4px 14px;background:var(--bg);min-width:0}
.nv button{border:0;border-radius:50%;width:30px;background:none}.nv button:hover{background:var(--hov)}
.bm{padding:2px 8px 4px;display:flex;gap:14px;flex:none;border-bottom:1px solid var(--bd)}.bm a,.pg a{cursor:pointer}.bm a:hover{text-decoration:underline}
.pg{flex:1;overflow:auto;padding:20px;user-select:text;background:var(--win)}
.np{text-align:center;padding-top:6%}.np h1{font-size:54px;margin:0 0 20px}.np input{width:min(500px,90%);border-radius:22px;padding:10px 18px}
.sc{display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap}.sc a{width:110px;padding:14px 6px;border-radius:8px;background:var(--bg);font-size:12px}.sc a:hover{background:var(--hov)}
.dlr{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:6px;margin:6px 0}.dlr a{color:var(--acc);text-decoration:underline}
.dlb{display:flex;gap:6px;padding:6px;border-top:1px solid var(--bd);background:var(--bg);flex:none;overflow-x:auto}.dlb:empty{display:none}
.dlb span{border:1px solid var(--bd);padding:6px 10px;border-radius:4px;background:var(--win);white-space:nowrap}
#toast{position:fixed;right:12px;bottom:52px;background:#222;color:#fff;padding:12px 16px;border-left:4px solid var(--acc);z-index:100001;display:none}
.win{animation:wo .2s cubic-bezier(.1,.9,.2,1)}@keyframes wo{from{opacity:0;transform:scale(.95)}}
#tbar,#start,#cm{backdrop-filter:blur(20px) saturate(150%)}#cm{background:color-mix(in srgb,var(--win) 92%,transparent)}
.ms{padding:8px;display:inline-block}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.mg{display:grid;gap:1px;background:var(--bd);border:2px solid var(--bd)}
.mc{width:28px;height:28px;display:grid;place-items:center;background:var(--bd);font-weight:700;cursor:default}.mc.o{background:var(--win)}.mc:not(.o):hover{background:var(--hov)}
.tm{background:#0c0c0c;color:#ccc;font:14px Consolas,monospace;min-height:100%;padding:6px;user-select:text}.to{white-space:pre-wrap}.tl{display:flex}.tl input{flex:1;background:none;border:0;color:#ccc;outline:0;padding:0;font:inherit}
.pt{display:flex;flex-direction:column;height:100%}.pt .t{display:flex;gap:6px;padding:6px;align-items:center;flex:none}.pt canvas{background:#fff;margin:6px;cursor:crosshair;max-width:calc(100% - 12px);touch-action:none}
#run{position:fixed;left:12px;bottom:52px;width:380px;background:var(--win);border:1px solid var(--acc);padding:14px;z-index:100000;box-shadow:0 8px 30px rgba(0,0,0,.5)}#run input{width:100%;margin:8px 0}
.scr{position:fixed;inset:0;z-index:200000;color:#fff;display:grid;place-items:center;text-align:center;background:#000}.scr .lk{text-align:center}.scr:has(.sp):before{content:""}
.sp{width:36px;height:36px;border:4px solid #fff3;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}
.drag iframe{pointer-events:none}
</style></head><body>
<div id="desk"><div id="icons"></div></div>
<div id="start"><div class="l"></div><div class="it" id="rst">⏻ Перезагрузка</div></div>
<div id="tbar"><div class="tbn" id="sb" style="font-size:20px">⊞</div><div id="srch">🔍 Введите для поиска</div><div id="tn" style="flex:none"></div><div id="clock"></div></div>
<div id="cm"></div><div id="toast"></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',acc:'#0078d7',wall:0};
const DEF=()=>({'Рабочий стол':[{n:'Привет.txt',c:'Добро пожаловать в Windows 10 Web!\nЗдесь работают окна, браузер, загрузки и темы.'}],'Документы':[],'Загрузки':[],'Изображения':[],'Корзина':[]});
let FS=DEF();
try{const a=localStorage.getItem('w10s');if(a)S=JSON.parse(a);const b=localStorage.getItem('w10f');if(b)FS=JSON.parse(b)}catch(e){}
const save=()=>{try{localStorage.setItem('w10s',JSON.stringify(S));localStorage.setItem('w10f',JSON.stringify(FS))}catch(e){}};
const WALLS=['linear-gradient(135deg,#0a3d91,#1fa2ff 60%,#12d8fa)','linear-gradient(135deg,#1d2b64,#f8cdda)','linear-gradient(135deg,#134e5e,#71b280)','#101820'];
const ACCS=['#0078d7','#e81123','#107c10','#8e44ad','#ff8c00'];
function apply(){document.documentElement.dataset.theme=S.theme;document.documentElement.style.setProperty('--acc',S.acc);$('#desk').style.background=WALLS[S.wall]}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}
function fsChanged(){save();icons();W.forEach(x=>x.refresh&&x.refresh())}

/* ---------- окна ---------- */
const APPS={
 crm:{t:'Эковело CRM',i:'🚲',w:1100,h:640,b:crm},
 browser:{t:'Браузер',i:'🌐',w:900,h:560,b:browser},
 explorer:{t:'Проводник',i:'📁',w:640,h:420,b:explorer},
 notepad:{t:'Блокнот',i:'📝',w:520,h:380,b:notepad},
 calc:{t:'Калькулятор',i:'🧮',w:270,h:380,b:calc},
 settings:{t:'Параметры',i:'⚙️',w:560,h:420,b:settings},
 mines:{t:'Сапёр',i:'💣',w:300,h:380,b:mines},
 term:{t:'Командная строка',i:'⬛',w:620,h:360,b:term},
 paint:{t:'Paint',i:'🎨',w:760,h:540,b:paint}};
const PIN=['crm','browser','explorer','notepad'];
let W=[],zi=10,cnt=0;
function open(app,arg){const a=APPS[app];cnt++;
 const e=el(`<div class="win" style="left:${50+cnt%8*28}px;top:${30+cnt%8*28}px;width:${a.w}px;height:${a.h}px"><div class="tb"><span>${a.i} ${a.t}</span><span class="bt"><i data-a="min">—</i><i data-a="max">▢</i><i data-a="x" class="cl">✕</i></span></div><div class="bd"></div></div>`);
 const w={app,e,i:a.i};W.push(w);$('#desk').append(e);a.b($('.bd',e),w,arg);focus(w);return w}
function focus(w){W.forEach(x=>x.e.classList.remove('f'));w.e.style.zIndex=++zi;w.e.classList.add('f');w.e.style.display='flex';w.min=false;tray()}
function closeW(w){w.e.remove();W=W.filter(x=>x!==w);tray()}
document.addEventListener('pointerdown',ev=>{
 const win=ev.target.closest('.win');if(!win){if(!ev.target.closest('#start,#sb'))$('#start').classList.remove('o');$('#cm').style.display='none';return}
 const w=W.find(x=>x.e===win);if(!win.classList.contains('f'))focus(w);
 const ic=ev.target.closest('.bt i');if(ic){const a=ic.dataset.a;if(a=='x')closeW(w);else if(a=='min'){w.e.style.display='none';w.min=true;tray()}else win.classList.toggle('max');return}
 const t=ev.target.closest('.tb');if(!t||win.classList.contains('max'))return;
 const dx=ev.clientX-win.offsetLeft,dy=ev.clientY-win.offsetTop;
 const mv=m=>{win.style.left=m.clientX-dx+'px';win.style.top=Math.max(0,Math.min(innerHeight-80,m.clientY-dy))+'px'};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);document.body.classList.remove('drag')};
 document.body.classList.add('drag');addEventListener('pointermove',mv);addEventListener('pointerup',up)});
document.addEventListener('dblclick',ev=>{const t=ev.target.closest('.tb');if(t&&!ev.target.closest('.bt'))t.parentNode.classList.toggle('max')});
function tray(){const keys=[...PIN,...Object.keys(APPS).filter(k=>!PIN.includes(k)&&W.some(w=>w.app==k))];
 $('#tn').innerHTML=keys.map(k=>{const ws=W.filter(w=>w.app==k),f=ws.some(w=>w.e.classList.contains('f')&&!w.min);return `<div class="tbn ${ws.length?'on':''} ${f?'fc':''}" data-k="${k}" title="${APPS[k].t}">${APPS[k].i}</div>`}).join('')}
$('#tn').onclick=e=>{const b=e.target.closest('.tbn');if(!b)return;const k=b.dataset.k,ws=W.filter(w=>w.app==k);
 if(!ws.length)open(k);else{const w=ws[ws.length-1];if(w.e.classList.contains('f')&&!w.min){w.e.style.display='none';w.min=true;tray()}else focus(w)}};

/* ---------- пуск, часы, меню ---------- */
$('#start .l').innerHTML=Object.keys(APPS).map(k=>`<div class="it" data-k="${k}"><span style="font-size:22px">${APPS[k].i}</span>${APPS[k].t}</div>`).join('');
$('#start').onclick=e=>{const i=e.target.closest('[data-k]');if(i){open(i.dataset.k);$('#start').classList.remove('o')}};
$('#sb').onclick=()=>$('#start').classList.toggle('o');
$('#srch').onclick=()=>open('browser');
$('#rst').onclick=()=>location.reload();
function clock(){const d=new Date();$('#clock').innerHTML=d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString('ru')}
setInterval(clock,10000);clock();
$('#desk').addEventListener('contextmenu',ev=>{ev.preventDefault();if(ev.target.closest('.win'))return;
 const m=$('#cm');m.innerHTML='<div data-c="new">Создать текстовый документ</div><div data-c="ref">Обновить</div><div data-c="per">Персонализация</div>';
 m.style.left=Math.min(ev.clientX,innerWidth-210)+'px';m.style.top=Math.min(ev.clientY,innerHeight-130)+'px';m.style.display='block'});
$('#cm').onclick=e=>{const c=e.target.dataset.c;$('#cm').style.display='none';
 if(c=='new'){FS['Рабочий стол'].push({n:uniq('Рабочий стол','Новый документ.txt'),c:''});fsChanged()}
 if(c=='ref')icons();if(c=='per')open('settings')};
function uniq(f,n){const L=FS[f].map(x=>x.n);if(!L.includes(n))return n;const m=n.match(/^(.*?)(\.[^.]*)?$/);let i=1;while(L.includes(`${m[1]} (${i})${m[2]||''}`))i++;return `${m[1]} (${i})${m[2]||''}`}

/* ---------- рабочий стол ---------- */
function icons(){const base=[['crm','🚲','Эковело CRM'],['browser','🌐','Браузер'],['explorer','📁','Этот компьютер'],['notepad','📝','Блокнот'],['calc','🧮','Калькулятор'],['settings','⚙️','Параметры'],['mines','💣','Сапёр'],['term','⬛','Терминал'],['paint','🎨','Paint']];
 $('#icons').innerHTML=base.map(b=>`<div class="ic" data-o="${b[0]}"><b>${b[1]}</b>${b[2]}</div>`).join('')+FS['Рабочий стол'].map((f,i)=>`<div class="ic" data-f="${i}"><b>📄</b>${esc(f.n)}</div>`).join('')}
$('#icons').ondblclick=e=>{const i=e.target.closest('.ic');if(!i)return;if(i.dataset.o)open(i.dataset.o,i.dataset.o=='explorer'?'Рабочий стол':undefined);else open('notepad',{f:'Рабочий стол',i:+i.dataset.f})};
$('#icons').onclick=e=>{document.querySelectorAll('.ic.s').forEach(x=>x.classList.remove('s'));const i=e.target.closest('.ic');if(i)i.classList.add('s')};

function crm(b,w){
 let html;try{html=new TextDecoder().decode(Uint8Array.from(atob(CRM_B64),c=>c.charCodeAt(0)))}catch(e){b.textContent='Не удалось загрузить CRM';return}
 const f=document.createElement('iframe');f.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff';
 b.style.cssText+=';overflow:hidden;position:relative';f.srcdoc=html;b.append(f)}
// Клик внутри iframe не доходит до окна — выводим окно вперёд по смене фокуса
addEventListener('blur',()=>{const a=document.activeElement;const x=W.find(v=>v.e.contains(a));if(x&&!x.e.classList.contains('f'))focus(x)});
// Ресайз за правый нижний угол: на время тянем iframe-ы «прозрачными» для мыши
document.addEventListener('pointerdown',ev=>{const win=ev.target.closest('.win');if(!win)return;const r=win.getBoundingClientRect();
 if(ev.clientX>r.right-20&&ev.clientY>r.bottom-20){document.body.classList.add('drag');addEventListener('pointerup',()=>document.body.classList.remove('drag'),{once:true})}});

/* ---------- проводник ---------- */
function explorer(b,w,arg){let cur=arg||'Документы';
 const r=w.refresh=()=>{if(!FS[cur])cur='Документы';b.innerHTML=`<div class="ex"><div class="nav">${Object.keys(FS).map(k=>`<div class="${k==cur?'sel':''}" data-p="${k}">📁 ${k}</div>`).join('')}</div><div class="fl"><div class="path">Этот компьютер › ${cur}</div>${FS[cur].map((f,i)=>`<div class="fi" data-i="${i}">📄 ${esc(f.n)}<small>${new Blob([f.c]).size} Б</small><u data-d="${i}" title="Удалить">🗑</u></div>`).join('')||'<p class="em">Эта папка пуста.</p>'}</div></div>`};
 b.onclick=e=>{const p=e.target.closest('[data-p]'),d=e.target.closest('[data-d]');if(p){cur=p.dataset.p;r()}else if(d){const[x]=FS[cur].splice(+d.dataset.d,1);if(cur!='Корзина')FS['Корзина'].push(x);fsChanged()}};
 b.ondblclick=e=>{const f=e.target.closest('.fi');if(f&&!e.target.closest('[data-d]'))open('notepad',{f:cur,i:+f.dataset.i})};r()}

/* ---------- блокнот ---------- */
function notepad(b,w,arg){let f=arg&&arg.f||'Документы',fi=arg?arg.i:-1,file=arg&&FS[f][fi];
 b.innerHTML=`<div class="np2"><div class="t"><input class="nm" style="flex:1" placeholder="Имя файла" value="${esc(file?file.n:'Без имени.txt')}"><select>${Object.keys(FS).map(k=>`<option ${k==f?'selected':''}>${k}</option>`).join('')}</select><button>💾 Сохранить</button></div><textarea spellcheck="false">${esc(file?file.c:'')}</textarea></div>`;
 $('button',b).onclick=()=>{const n=$('.nm',b).value.trim()||'Без имени.txt',c=$('textarea',b).value,nf=$('select',b).value;
  if(file&&nf==f&&FS[f][fi]===file){file.n=n;file.c=c}else{file={n:uniq(nf,n),c};FS[nf].push(file);f=nf;fi=FS[nf].length-1}
  fsChanged();toast('Файл сохранён: '+f)}}

/* ---------- калькулятор ---------- */
function calc(b){const K='C ( ) / 7 8 9 * 4 5 6 - 1 2 3 + 0 . ⌫ ='.split(' ');let v='';
 b.innerHTML=`<div class="cal"><div class="d">0</div>${K.map(k=>`<button>${k}</button>`).join('')}</div>`;const d=$('.d',b);
 b.onclick=e=>{if(e.target.tagName!='BUTTON')return;const k=e.target.textContent;
  if(k=='C')v='';else if(k=='⌫')v=v.slice(0,-1);else if(k=='='){try{if(/^[0-9+\-*/.() ]+$/.test(v))v=String(+Function('return '+v)().toFixed(10))}catch(x){v='Ошибка'}}else{if(v=='Ошибка')v='';v+=k}
  d.textContent=v||'0'}}

/* ---------- параметры ---------- */
function settings(b){const r=()=>{b.innerHTML=`<div class="set"><h2 style="margin:0">Персонализация</h2><h3>Тема</h3><button data-t="light">☀️ Светлая</button> <button data-t="dark">🌙 Тёмная</button><h3>Цвет акцента</h3>${ACCS.map(c=>`<span class="sw" data-a="${c}" style="background:${c};border-color:${S.acc==c?'var(--fg)':'transparent'}"></span>`).join('')}<h3>Фон рабочего стола</h3>${WALLS.map((c,i)=>`<span class="sw" data-w="${i}" style="background:${c};border-color:${S.wall==i?'var(--fg)':'transparent'}"></span>`).join('')}<h3>Система</h3><button data-r="1">Сбросить файлы и настройки</button></div>`};
 b.onclick=e=>{const t=e.target.dataset;if(t.t)S.theme=t.t;if(t.a)S.acc=t.a;if(t.w)S.wall=+t.w;if(t.r){FS=DEF();S={theme:'light',acc:'#0078d7',wall:0};fsChanged()}apply();save();r()};r()}

/* ---------- браузер ---------- */
const DLS={'заметки.txt':'Это файл, скачанный из браузера.\nОн лежит в папке «Загрузки».','данные.json':'{\n  "система": "Windows 10 Web",\n  "ok": true\n}','картинка.svg':'<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120"><rect width="200" height="120" fill="#0078d7"/><text x="30" y="68" fill="#fff" font-size="26">Hello</text></svg>','страница.html':'<h1>Привет!</h1><p>Это HTML-файл.</p>','отчёт.csv':'месяц;продажи\nянварь;120\nфевраль;150'};
const SITES=[['youtube.com','▶️','YouTube'],['files.local','📦','Файлы'],['about.local','ℹ️','О системе'],['chrome://downloads','⬇️','Загрузки']];
const SESSION_DL=[];
function dl(name){const c=DLS[name];if(c==null)return;const n=uniq('Загрузки',name);FS['Загрузки'].push({n,c});SESSION_DL.push(n);fsChanged();toast('Загрузка завершена: '+n)}
function norm(s){s=s.trim();if(!s)return'new';if(/^(chrome|search):/.test(s))return s;const y=s.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([\w-]{11})/);if(y)return'yt://'+y[1];if(/^(https?:\/\/)?(www\.|m\.)?youtube\.com\/?$/i.test(s))return'youtube.com';s=s.replace(/^https?:\/\//,'').replace(/\/$/,'');return /\.[a-zа-я]{2,}$/i.test(s)&&!s.includes(' ')?s:'search://'+s}
function page(u){
 if(u.startsWith('yt://'))return `<div style="margin:-20px;height:calc(100% + 40px);display:flex;flex-direction:column"><div style="padding:8px 12px"><a data-go="youtube.com">← YouTube</a></div><iframe style="flex:1;border:0;width:100%" src="https://www.youtube-nocookie.com/embed/${esc(u.slice(5))}?autoplay=1" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`;
 if(u=='proxy://'){let P='';try{P=localStorage.getItem('w10proxy')||''}catch(e){}return P?`<div style="margin:-20px;height:calc(100% + 40px)"><iframe style="border:0;width:100%;height:100%" src="${esc(P)}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>`:'<p>Адрес прокси не задан: укажите его на странице YouTube.</p>'}
 if(u=='youtube.com'){let P='';try{P=localStorage.getItem('w10proxy')||''}catch(e){}return `<div style="max-width:640px;margin:0 auto"><h2>▶️ YouTube</h2><p>Вставьте ссылку на видео — оно откроется во встроенном плеере.</p><div class="row"><input id="yq" placeholder="https://www.youtube.com/watch?v=..." style="flex:1"><button data-yt="1">Смотреть</button></div><h3>Свой прокси-сервер</h3><p class="mut">Если YouTube у вас не открывается напрямую, укажите адрес своего сервера (например, свой Piped или Invidious на VPS за границей).</p><div class="row"><input id="px" value="${esc(P)}" placeholder="https://ваш-сервер.example" style="flex:1"><button data-px="1">Сохранить</button><button data-go="proxy://">Открыть</button></div></div>`}
 if(u=='new')return `<div class="np"><h1><span style="color:#4285f4">E</span><span style="color:#ea4335">c</span><span style="color:#fbbc05">o</span><span style="color:#34a853">Web</span></h1><input id="q" placeholder="Введите запрос или адрес" autofocus><div class="sc">${SITES.map(s=>`<a data-go="${s[0]}"><span style="font-size:26px">${s[1]}</span><br>${s[2]}</a>`).join('')}</div></div>`;
 if(u=='files.local')return `<h2>📦 Файлы для скачивания</h2><p>Нажмите на ссылку — файл появится в папке «Загрузки» проводника.</p>${Object.keys(DLS).map(n=>`<div class="dlr">📄 <a data-dl="${n}">${n}</a><small style="margin-left:auto">${DLS[n].length} Б</small></div>`).join('')}`;
 if(u=='about.local')return `<h2>Windows 10 Web</h2><p>Учебная модель рабочего стола: окна, проводник, блокнот, калькулятор, браузер и параметры. Файлы хранятся в виртуальной папке (localStorage вашего браузера).</p><p>Реальные сайты из этой песочницы не открываются, поэтому браузер показывает локальные страницы.</p>`;
 if(u=='chrome://downloads')return `<h2>⬇️ Загрузки</h2>${FS['Загрузки'].map(f=>`<div class="dlr">📄 ${esc(f.n)}</div>`).join('')||'<p class="em">Пока ничего не скачано.</p>'}`;
 if(u.startsWith('search://')){const q=esc(u.slice(9));return `<h2>Результаты: «${q}»</h2><p><a data-go="files.local">files.local</a> — Файлы для скачивания</p><p><a data-go="about.local">about.local</a> — О системе</p><p style="opacity:.6">Это локальный поиск: интернет-поиск в песочнице недоступен.</p>`}
 return `<div style="max-width:520px;margin:8% auto"><div style="font-size:60px">☹️</div><h2>Не удаётся получить доступ к сайту</h2><p>Не удалось найти страницу <b>${esc(u)}</b>.</p><p style="opacity:.6">ERR_INTERNET_DISCONNECTED — в этой песочнице внешний интернет заблокирован.</p><p><a data-go="files.local" style="color:var(--acc)">Открыть files.local</a></p></div>`}
function browser(b,w,arg){
 b.innerHTML=`<div class="br"><div class="tabs"></div><div class="nv"><button data-c="b">←</button><button data-c="f">→</button><button data-c="r">⟳</button><input class="url" spellcheck="false" placeholder="Поиск или адрес"><button data-c="d" title="Загрузки">⬇</button></div><div class="bm">${SITES.map(s=>`<a data-go="${s[0]}">${s[1]} ${s[2]}</a>`).join('')}</div><div class="pg"></div><div class="dlb"></div></div>`;
 let T=[{h:['new'],i:0}],c=0,seen=0;const url=$('.url',b),pg=$('.pg',b);
 const cur=()=>T[c],u=()=>cur().h[cur().i];
 const title=x=>x=='new'?'Новая вкладка':x.replace('search://','🔍 ');
 const draw=w.refresh=()=>{
  $('.tabs',b).innerHTML=T.map((t,i)=>`<div class="tab ${i==c?'a':''}" data-t="${i}">${esc(title(t.h[t.i]))}<u data-x="${i}">✕</u></div>`).join('')+'<div class="tab" data-t="+" style="min-width:0;background:none">＋</div>';
  url.value=u()=='new'?'':u();pg.innerHTML=page(u());
  $('.dlb',b).innerHTML=SESSION_DL.map(n=>`<span>📄 ${esc(n)} ✓ <a data-show="1" style="cursor:default;text-decoration:underline">показать</a></span>`).join('')};
 const go=x=>{const t=cur();t.h=t.h.slice(0,t.i+1);t.h.push(x);t.i++;draw()};
 b.onclick=e=>{const t=e.target,g=t.closest('[data-go]'),d=t.closest('[data-dl]'),tb=t.closest('[data-t]'),x=t.closest('[data-x]'),cm=t.dataset.c;
  if(g)go(g.dataset.go);else if(d)dl(d.dataset.dl);else if(x){T.splice(+x.dataset.x,1);if(!T.length)T=[{h:['new'],i:0}];c=Math.min(c,T.length-1);draw()}
  else if(tb){if(tb.dataset.t=='+'){T.push({h:['new'],i:0});c=T.length-1}else c=+tb.dataset.t;draw()}
  else if(t.dataset.show)open('explorer','Загрузки');
  else if(cm=='b'&&cur().i>0){cur().i--;draw()}else if(cm=='f'&&cur().i<cur().h.length-1){cur().i++;draw()}else if(cm=='r')draw();else if(cm=='d')go('chrome://downloads')};
 b.addEventListener('click',e=>{const t=e.target;if(t.dataset.yt){const n=norm($('#yq',b).value);if(n.startsWith('yt://'))go(n);else toast('Не похоже на ссылку YouTube')}if(t.dataset.px){try{localStorage.setItem('w10proxy',$('#px',b).value.trim())}catch(x){}toast('Адрес прокси сохранён')}});
 b.onkeydown=e=>{if(e.key!='Enter')return;if(e.target==url)go(norm(url.value));else if(e.target.id=='q')go(norm(e.target.value));else if(e.target.id=='yq'){const n=norm(e.target.value);if(n.startsWith('yt://'))go(n)}};draw()}

/* ---------- Сапёр ---------- */
function mines(b,w){const N=9,M=10;let g,over,first,t,iv;
 const init=()=>{g=Array.from({length:N*N},()=>({m:0,o:0,f:0,n:0}));over=0;first=1;t=0;clearInterval(iv);draw()};
 const nb=i=>{const x=i%N,y=i/N|0,r=[];for(let dy=-1;dy<2;dy++)for(let dx=-1;dx<2;dx++){const a=x+dx,c=y+dy;if((dx||dy)&&a>=0&&a<N&&c>=0&&c<N)r.push(c*N+a)}return r};
 const place=s=>{let k=0;while(k<M){const i=Math.random()*N*N|0;if(i!=s&&!nb(s).includes(i)&&!g[i].m){g[i].m=1;k++}}g.forEach((c,i)=>c.n=nb(i).filter(j=>g[j].m).length)};
 const rev=i=>{const c=g[i];if(c.o||c.f)return;c.o=1;if(c.m){over=2;return}if(!c.n)nb(i).forEach(rev)};
 const draw=()=>{if(!over&&!first&&g.every(c=>c.m||c.o))over=1;if(over)clearInterval(iv);
  b.innerHTML=`<div class="ms"><div class="mh"><span>🚩 ${M-g.filter(c=>c.f).length}</span><button>${over==2?'😵':over==1?'😎':'🙂'}</button><span>⏱ ${t}</span></div><div class="mg" style="grid-template-columns:repeat(${N},28px)">${g.map((c,i)=>`<div class="mc ${c.o?'o':''}" data-i="${i}">${c.o?(c.m?'💣':c.n||''):c.f?'🚩':over==2&&c.m?'💣':''}</div>`).join('')}</div></div>`};
 b.onclick=e=>{if(e.target.tagName=='BUTTON')return init();const c=e.target.closest('.mc');if(!c||over)return;const i=+c.dataset.i;
  if(first){place(i);first=0;iv=setInterval(()=>{if(!b.isConnected)return clearInterval(iv);t++;$('.mh span:last-child',b).textContent='⏱ '+t},1000)}
  rev(i);draw()};
 b.oncontextmenu=e=>{e.preventDefault();const c=e.target.closest('.mc');if(!c||over)return;const x=g[+c.dataset.i];if(!x.o)x.f=!x.f;draw()};init()}

/* ---------- Командная строка ---------- */
function term(b,w){let cwd=null;b.innerHTML='<div class="tm"><div class="to">Microsoft Windows [Version 10.0.19045]\n(c) Корпорация Майкрософт. Все права защищены.\nВведите help для списка команд.\n\n</div><div class="tl"><span class="tp"></span><input spellcheck="false"></div></div>';
 const o=$('.to',b),inp=$('input',b),p=$('.tp',b);const pr=()=>p.textContent='C:\\Users\\User'+(cwd?'\\'+cwd:'')+'>';const out=s=>{o.textContent+=s+'\n';b.scrollTop=1e9};
 inp.onkeydown=e=>{if(e.key!='Enter')return;const L=inp.value.trim();out(p.textContent+L);inp.value='';const[c,...r]=L.split(/\s+/),a=r.join(' '),cm=c.toLowerCase();
  if(cm=='help')out('dir cd type echo cls mkdir del date time exit');
  else if(cm=='dir')out(cwd?(FS[cwd].map(f=>f.n).join('\n')||'Файлов нет'):Object.keys(FS).map(k=>'<DIR>  '+k).join('\n'));
  else if(cm=='cd'){if(a=='..'||!a)cwd=null;else if(FS[a]&&!cwd)cwd=a;else out('Системе не удаётся найти указанный путь.')}
  else if(cm=='type'){const f=cwd&&FS[cwd].find(x=>x.n==a);out(f?f.c:'Не удаётся найти указанный файл.')}
  else if(cm=='echo')out(a);else if(cm=='cls')o.textContent='';
  else if(cm=='mkdir'){if(!cwd&&a){FS[a]=FS[a]||[];fsChanged()}else out('Папку можно создать только в корне.')}
  else if(cm=='del'){const i=cwd?FS[cwd].findIndex(x=>x.n==a):-1;if(i<0)out('Не удаётся найти указанный файл.');else{FS[cwd].splice(i,1);fsChanged()}}
  else if(cm=='date')out(new Date().toLocaleDateString('ru'));else if(cm=='time')out(new Date().toLocaleTimeString('ru'));
  else if(cm=='exit')return closeW(w);else if(cm)out('«'+c+'» не является внутренней или внешней командой.');
  pr()};pr();inp.focus();b.onclick=()=>inp.focus()}

/* ---------- Paint ---------- */
function paint(b){b.innerHTML='<div class="pt"><div class="t"><input type="color" value="#000000"><input type="range" min="1" max="30" value="3"><button data-e>Ластик</button><button data-c>Очистить</button><button data-s>💾 В «Изображения»</button></div><canvas width="700" height="420"></canvas></div>';
 const cv=$('canvas',b),x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,700,420);x.lineCap='round';let er=0,dr=0;
 const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.onpointerdown=e=>{dr=1;cv.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pos(e))};
 cv.onpointermove=e=>{if(!dr)return;x.strokeStyle=er?'#fff':$('[type=color]',b).value;x.lineWidth=$('[type=range]',b).value;x.lineTo(...pos(e));x.stroke()};
 cv.onpointerup=()=>dr=0;
 b.onclick=e=>{const d=e.target.dataset;if('e' in d){er=!er;e.target.style.background=er?'var(--hov)':''}if('c' in d){x.fillStyle='#fff';x.fillRect(0,0,700,420)}
  if('s' in d){FS['Изображения'].push({n:uniq('Изображения','Рисунок.svg'),c:'<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420"><image href="'+cv.toDataURL()+'"/></svg>'});fsChanged();toast('Сохранено в «Изображения»')}}}

/* ---------- Выполнить, экраны, горячие клавиши ---------- */
function screen(h,fn){const s=el('<div class="scr">'+h+'</div>');document.body.append(s);s.onclick=()=>fn?fn(s):0;return s}
function bsod(){screen('<div style="padding:8% 10%;font-size:20px;line-height:1.6;text-align:left"><div style="font-size:120px">:(</div>На вашем ПК возникла проблема, и его необходимо перезагрузить.<br><br>Код остановки: CRITICAL_PROCESS_DIED<br><small>Нажмите, чтобы перезагрузить.</small></div>',()=>location.reload()).style.background='#0078d7'}
function lock(){const s=screen('<div class="lk"><div style="font-size:90px;font-weight:200" id="lt"></div><div id="ld" style="font-size:24px"></div><p style="margin-top:80px">Нажмите, чтобы войти</p></div>',s=>s.remove());
 const d=new Date();$('#lt',s).textContent=d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});$('#ld',s).textContent=d.toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'});s.style.background=WALLS[S.wall]}
function run(){if($('#run'))return;const d=el('<div id="run"><b>Выполнить</b><p>Введите имя программы, и Windows откроет её (notepad, calc, cmd, mspaint, minesweeper, explorer, control, bsod).</p><input spellcheck="false"><div><button>ОК</button> <button>Отмена</button></div></div>');document.body.append(d);const i=$('input',d);i.focus();
 const R={notepad:'notepad',calc:'calc',explorer:'explorer',cmd:'term',mspaint:'paint',minesweeper:'mines',control:'settings',chrome:'browser'};
 const go=()=>{const v=i.value.trim().toLowerCase();d.remove();if(v=='bsod')bsod();else if(R[v])open(R[v]);else if(v)toast('Windows не удаётся найти «'+v+'»')};
 i.onkeydown=e=>{if(e.key=='Enter')go();if(e.key=='Escape')d.remove()};const bs=d.querySelectorAll('button');bs[0].onclick=go;bs[1].onclick=()=>d.remove()}
function showDesk(){const all=W.every(w=>w.min);W.forEach(w=>{w.min=!all;w.e.style.display=all?'flex':'none'});tray()}
$('#start').insertAdjacentHTML('beforeend','<div class="it" id="b1">▶ Выполнить</div><div class="it" id="b2">🔒 Блокировка</div><div class="it" id="b3">⏻ Завершение работы</div>');
const cl=()=>$('#start').classList.remove('o');$('#b1').onclick=()=>{cl();run()};$('#b2').onclick=()=>{cl();lock()};
$('#b3').onclick=()=>{cl();screen('<div><div style="font-size:60px">⊞</div><p>Завершение работы…</p><div class="sp"></div><small>Нажмите, чтобы включить</small></div>',()=>location.reload())};
$('#tbar').insertAdjacentHTML('beforeend','<div id="sdk" title="Показать рабочий стол" style="width:8px;border-left:1px solid #666"></div>');$('#sdk').onclick=showDesk;
let mk=0;addEventListener('keydown',e=>{if(e.key=='Meta')return;if(e.metaKey)mk=1;if(e.metaKey||e.altKey){const f={e:()=>open('explorer'),r:run,l:lock,d:showDesk}[e.key.toLowerCase()];if(f){e.preventDefault();f()}}if(e.key=='Escape')cl()});
addEventListener('keyup',e=>{if(e.key=='Meta'){if(!mk)$('#start').classList.toggle('o');mk=0}});

FS['Корзина']=FS['Корзина']||[];
apply();icons();tray();
const boot=screen('<div><div style="font-size:70px">⊞</div><div class="sp"></div></div>');setTimeout(()=>{boot.remove();const w=open('crm');w.e.classList.add('max')},1400);
</script></body></html>
