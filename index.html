<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("ecovelo_theme")||"light";if(t==="auto")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Эковело CRM Екатеринбург</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef1f5;--card:#fff;--fg:#17212b;--mut:#707e8c;--line:#e3e8ee;--acc:#3390ec;--acc2:#2b7fd6;--sel:#3390ec;--danger:#d14b4b;--hov:#eef4fb;--warn:#b7791f;--okbg:#e3f6e8;--okfg:#1b7a3d;--wbg:#fdf3dc;--wfg:#8a5a12;--ebg:#fde7e7;--efg:#b02a2a;--dbd:#f2cccc;--dhov:#fdeeee;--nbd:#f0e0b8;--sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06)}
[data-theme=dark]{color-scheme:dark;--bg:#0e1621;--card:#17212b;--fg:#f1f4f7;--mut:#7f91a4;--line:#243241;--acc:#4f9be8;--acc2:#3f8bd8;--sel:#2b5278;--danger:#ec7777;--hov:#202d3b;--okbg:#17402a;--okfg:#7fdca0;--wbg:#3b3017;--wfg:#e8c476;--ebg:#442426;--efg:#f19a9a;--dbd:#5a2d2d;--dhov:#3a2326;--nbd:#5a4a22;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
header{position:sticky;top:0;z-index:20;height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px}
header .lg{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#72d5fd,#2a9ef1);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
header h1{font-size:17px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sp{flex:1}
header .sig{font-size:11px;color:var(--mut);letter-spacing:.06em}
.chip{display:flex;align-items:center;gap:8px;border:0;background:var(--hov);border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;max-width:260px}
.chip:hover{background:var(--line)}
.chip .user{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:20px;flex:0 0 auto}
.chip .av{width:30px;height:30px;font-size:13px}
.av.big{width:88px;height:88px;font-size:34px;margin:0 auto 10px}
.layout{display:flex;min-height:calc(100vh - 60px)}
nav.side{width:290px;background:var(--card);border-right:1px solid var(--line);padding:8px;flex:0 0 auto;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
nav.side button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:12px;color:var(--fg);cursor:pointer;margin:2px 0;font:inherit}
nav.side button:hover{background:var(--hov)}
nav.side button.on{background:var(--sel);color:#fff}
nav.side .nt{display:flex;flex-direction:column;min-width:0}
nav.side .nt b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.side .nt small{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.side button.on .nt small{color:rgba(255,255,255,.8)}
main{flex:1;padding:20px;min-width:0;max-width:1280px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h2{margin:0 0 14px;font-size:18px;font-weight:600}
h3{margin:16px 0 8px;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px;font-weight:500;transition:background .15s,border-color .15s,box-shadow .15s}
button:hover{background:var(--hov)}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 2px 8px rgba(51,144,236,.3)}
button.p:hover{background:var(--acc2)}
button.d{color:var(--danger);border-color:var(--dbd)}
button.d:hover{background:var(--dhov)}
button.sm{padding:5px 10px;font-size:13px;border-radius:8px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(51,144,236,.18)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tr:hover td{background:var(--hov)}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--hov);color:var(--fg);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--okfg)}
.badge.warn{background:var(--wbg);color:var(--wfg)}
.badge.err{background:var(--ebg);color:var(--efg)}
.mut{color:var(--mut);font-size:13px}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--acc);transform:translateY(-1px)}
.tile .n{font-weight:600;font-size:15px}
.tile .p{color:var(--mut);font-size:13px}
.search{position:relative}
.search input{padding-right:34px}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);font-size:18px;padding:4px 8px;cursor:pointer;box-shadow:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;border-bottom:2px solid transparent;background:none;border-radius:8px 8px 0 0;padding:9px 16px;color:var(--mut)}
.tabs button.on{border-bottom-color:var(--acc);color:var(--acc);font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(10,18,30,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:60;overflow:auto}
.modal-bg.on{display:flex}
.modal{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:640px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.modal h3{margin-top:0;color:var(--fg);text-transform:none;font-size:18px;letter-spacing:0}
.modal .act{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(23,33,43,.92);color:#fff;padding:10px 18px;border-radius:999px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;font-size:14px}
.toast.on{opacity:1}
.login{max-width:380px;margin:9vh auto;padding:30px 26px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.logo{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#72d5fd,#2a9ef1);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 14px}
.hidden{display:none!important}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.chk input{width:auto}
.note{background:var(--wbg);color:var(--wfg);border:1px solid var(--nbd);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.bk{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.seg{display:inline-flex;background:var(--hov);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 16px;border-radius:10px}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15);color:var(--acc)}
.prof{text-align:center;padding:26px 18px}
.prof .pn{font-size:20px;font-weight:600}
.srow{display:flex;align-items:center;gap:14px;padding:12px 2px;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .si{width:38px;height:38px;border-radius:50%;background:var(--hov);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.srow .st{flex:1;min-width:0}
.srow .st b{display:block;font-weight:600}
@media (max-width:760px){
  header{padding:0 12px;gap:8px}header h1{font-size:15px}header .sig{display:none}.chip .user{display:none}.chip{padding:4px}
  .layout{display:block}
  nav.side{position:fixed;left:0;right:0;top:auto;bottom:0;width:100%;height:auto;display:flex;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:30;gap:2px}
  nav.side button{flex:0 0 auto;flex-direction:column;gap:3px;padding:6px 10px;min-width:68px;text-align:center;margin:0}
  nav.side .av{width:32px;height:32px;font-size:16px}
  nav.side .nt small{display:none}
  nav.side .nt b{font-size:11px;font-weight:500}
  main{padding:12px 12px 96px}
  .card{padding:14px;overflow-x:auto}
  th,td{padding:8px 6px}
}
</style>
</head>
<body>

<div id="loginView" class="hidden">
  <div class="login">
    <div class="logo">⚡</div>
    <h2 style="text-align:center;color:var(--fg)">Эковело CRM Екатеринбург</h2>
    <p class="mut" style="text-align:center;margin:0 0 14px">Введите своё имя для входа</p>
    <label>Имя</label>
    <input id="lName" type="text" autocomplete="off" placeholder="Например: MARM" maxlength="60">
    <label>PIN-код</label>
    <input id="lPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••">
    <div id="lErr" style="color:var(--danger);font-size:13px;min-height:18px;margin-top:8px"></div>
    <button class="p" id="lBtn" style="width:100%;margin-top:10px">Войти</button>
    <p class="mut" style="font-size:12px;text-align:center;margin-top:14px">PIN-код выдаёт главный администратор.</p>
    <p class="mut" style="font-size:11px;text-align:center;letter-spacing:.05em">by MARM</p>
  </div>
</div>

<div id="connErrorView" class="hidden">
  <div class="login">
    <h2 style="text-align:center;color:var(--danger)">Нет связи с базой</h2>
    <p class="mut" style="text-align:center;margin:0 0 14px">Проверьте интернет и повторите попытку</p>
    <div id="connErr" style="color:var(--danger);font-size:13px;min-height:18px;margin:8px 0"></div>
    <button class="p" id="connRetry" style="width:100%;margin-top:10px">Повторить</button>
  </div>
</div>

<div id="appView" class="hidden">
  <header>
    <div class="lg">⚡</div>
    <h1>Эковело CRM Екатеринбург</h1>
    <div class="sp"></div>
    <button class="chip" id="userChip" title="Настройки"><span class="av" id="userAv"></span><span class="user" id="userInfo"></span></button>
    <span class="sig">by MARM</span>
  </header>
  <div class="layout">
    <nav class="side" id="nav"></nav>
    <main><div id="main"></div><div id="bkBar" class="bk"></div></main>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   SUPABASE: ПОДКЛЮЧЕНИЕ
   ========================================================= */
const SUPABASE_URL = "https://ugccikvfccdcfdmaonue.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnY2Npa3ZmY2NkY2ZkbWFvbnVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0MTM3NzEsImV4cCI6MjEwOTk4OTc3MX0.mI5D_Y2Q6FjPeg2i2b_C-ENakrKXQSybSEOzCYvuo7s";

const { createClient } = supabase;
let supabaseClient = null;

async function initSupabase(){
  const client = createClient(SUPABASE_URL, SUPABASE_KEY);
  const { error } = await client.from('staff').select('id').limit(1);
  if(error) throw new Error(error.message);
  supabaseClient = client;
  return true;
}

/* =========================================================
   ЛОКАЛЬНАЯ КОПИЯ ДАННЫХ
   ========================================================= */
function emptyDB(){
  return {staff:[],permissions:[],warehouse:[],bikes:[],components:[],services:[],repairs:[],repairItems:[],audit:[]};
}
let DB = emptyDB();

function uid(prefix){
  return (prefix||"id_") + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
}

async function loadAllFromServer(){
  const tables = ['staff','permissions','warehouse','bikes','components','services','repairs','repair_items','audit'];
  const names  = ['staff','permissions','warehouse','bikes','components','services','repairs','repairItems','audit'];
  const results = await Promise.all(tables.map(t=>supabaseClient.from(t).select('*')));
  results.forEach((r,i)=>{
    if(r.error){ console.error('Ошибка загрузки '+names[i]+':', r.error); DB[names[i]] = []; }
    else DB[names[i]] = r.data || [];
  });
}

async function dbInsert(table, row){
  const { data, error } = await supabaseClient.from(table).insert([row]).select();
  if(error){ toast('Ошибка сохранения: '+error.message); return null; }
  return data ? data[0] : null;
}
async function dbUpdate(table, id, patch){
  const { error } = await supabaseClient.from(table).update(patch).eq('id', id);
  if(error){ toast('Ошибка обновления: '+error.message); return false; }
  return true;
}
async function dbDelete(table, id){
  const { error } = await supabaseClient.from(table).delete().eq('id', id);
  if(error){ toast('Ошибка удаления: '+error.message); return false; }
  return true;
}
async function dbDeleteMany(table, ids){
  if(!ids.length) return true;
  const { error } = await supabaseClient.from(table).delete().in('id', ids);
  if(error){ toast('Ошибка удаления: '+error.message); return false; }
  return true;
}

async function log(userName, action, entity, entityId){
  const row = {id:uid("a_"), userName:userName||(ME?ME.name:"—"), action, entity, entityId:entityId||"", at:new Date().toISOString()};
  DB.audit.unshift(row);
  if(DB.audit.length>2000) DB.audit = DB.audit.slice(0,2000);
  await supabaseClient.from('audit').insert([row]);
}

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function btn(txt,cls,fn){const b=el('button',cls,txt);b.type='button';b.onclick=fn;return b;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtMoney(v){return new Intl.NumberFormat('ru-RU').format(Number(v)||0)+' ₽';}
function fmtDate(s){ if(!s) return ''; return new Date(s).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}); }

const SECTIONS = [
  {id:'warehouse', label:'Склад', ic:'📦', g:3},
  {id:'bikes', label:'Электровелосипеды', ic:'🚲', g:5},
  {id:'electric', label:'Наличие', ic:'⚡', g:4},
  {id:'price', label:'Прайс', ic:'🏷', g:1},
  {id:'repair', label:'Ремонт', ic:'🔧', g:0},
  {id:'admin', label:'Администрирование', ic:'🛡', g:2},
  {id:'settings', label:'Настройки', ic:'⚙️', g:7},
];
const BIKE_STATES = {ready:'Готов',diagnostics:'Диагностика',broken:'Неисправен',repair:'В ремонте',wait_parts:'Ожидает запчасти'};
const COMP_KINDS = {controller:'Контроллер',battery:'Аккумулятор',motor:'Мотор-колесо',display:'Дисплей',wiring:'Проводка',iot:'IoT-модуль',brakes:'Тормоза',other:'Другое'};
const COMP_RESULTS = {ok:'Исправен',bad:'Неисправен',check:'Требует проверки',unchecked:'Не проверен'};
const REPAIR_STATUSES = {accepted:'Принят',in_work:'В работе',wait_parts:'Ожидает запчасти',ready:'Готов',issued:'Выдан'};
const PAYMENTS = {qr:'QR-код',transfer:'Перевод',cash:'Наличные'};

function openModal(builder){
  const bg=$('#modalBg'), box=$('#modalBox');
  box.textContent='';
  builder(box, ()=>closeModal());
  bg.classList.add('on');
}
function closeModal(){ $('#modalBg').classList.remove('on'); $('#modalBox').textContent=''; }
$('#modalBg').addEventListener('pointerdown',e=>{ if(e.target.id==='modalBg') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* =========================================================
   СЕССИЯ И ВХОД (через сервер)
   ========================================================= */
let ME = null;
let PERMS = {};

function loadSession(){
  try{
    const raw = localStorage.getItem('ecovelo_session_v1');
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !s.name) return null;
    const st = DB.staff.find(x=>x.name.toLowerCase()===s.name.toLowerCase());
    if(!st || !st.active) return null;
    return st;
  }catch(e){ return null; }
}
function saveSession(staff){
  try{ localStorage.setItem('ecovelo_session_v1', JSON.stringify({id:staff.id, name:staff.name})); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem('ecovelo_session_v1'); }catch(e){}
}

function buildPerms(staff){
  const p = {};
  if(staff.role==='admin'){
    SECTIONS.forEach(s=>p[s.id]={view:true, edit:true});
    return p;
  }
  DB.permissions.filter(x=>x.userId===staff.id).forEach(x=>{
    p[x.section] = { view: !!(x.canView||x.canEdit), edit: !!x.canEdit };
  });
  return p;
}

const OWNER_PIN='7913';
async function hashPin(pin,salt){
  const d=salt+':'+pin;
  try{ if(window.crypto&&crypto.subtle){ const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d)); return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''); } }catch(e){}
  let h=5381; for(let i=0;i<d.length;i++) h=((h<<5)+h+d.charCodeAt(i))|0; return 'x'+(h>>>0).toString(16);
}
function lockLeft(){try{const f=JSON.parse(localStorage.getItem('ecovelo_fail')||'{}');return Math.max(0,(f.until||0)-Date.now());}catch(e){return 0;}}
function failLogin(){try{const f=JSON.parse(localStorage.getItem('ecovelo_fail')||'{}');f.n=(f.n||0)+1;if(f.n>=5){f.until=Date.now()+60000;f.n=0;}localStorage.setItem('ecovelo_fail',JSON.stringify(f));}catch(e){}}

async function doLogin(){
  const E=$('#lErr'); E.textContent='';
  const name=$('#lName').value.trim(), pin=$('#lPin').value.trim();
  if(!name||!pin){ E.textContent='Введите имя и PIN-код'; return; }
  const left=lockLeft(); if(left>0){ E.textContent='Слишком много попыток. Подождите '+Math.ceil(left/1000)+' с.'; return; }
  const { data, error } = await supabaseClient.from('staff').select('*').ilike('name', name).limit(1);
  if(error){ E.textContent='Ошибка базы: '+error.message; return; }
  let st = data && data[0] ? data[0] : null;
  const isOwner=name.toLowerCase()==='marm';
  let ok=false;
  if(st&&st.pinHash) ok=(await hashPin(pin,st.pinSalt))===st.pinHash;
  else if(isOwner) ok=pin===OWNER_PIN;
  if(!ok){ failLogin(); E.textContent='Неверное имя или PIN-код. Если PIN-код не выдан — обратитесь к администратору.'; return; }
  try{localStorage.removeItem('ecovelo_fail');}catch(e){}
  if(!st){
    st={id:uid("s_"),name:'MARM',role:'admin',active:true,createdAt:new Date().toISOString()};
    const created = await dbInsert('staff', st);
    if(created) st = created;
    DB.staff.push(st);
    for(const x of SECTIONS){
      const pr={id:uid("p_"),userId:st.id,section:x.id,canView:true,canEdit:true};
      await dbInsert('permissions',pr);
      DB.permissions.push(pr);
    }
    await log('MARM','create','staff',st.id);
  }
  if(!st.pinHash){
    st.pinSalt=uid('x_'); st.pinHash=await hashPin(pin,st.pinSalt);
    await dbUpdate('staff', st.id, {pinSalt:st.pinSalt, pinHash:st.pinHash});
  }
  if(!st.active){ E.textContent='Доступ отключён администратором'; return; }
  ME=st; PERMS=buildPerms(st); saveSession(st); $('#lPin').value='';
  await loadAllFromServer();
  enterApp();
}

function can(section,action){
  if(!ME) return false;
  if(section==='settings') return true;
  if(ME.role==='admin') return true;
  const p = PERMS[section];
  if(!p) return false;
  return action==='edit' ? !!p.edit : !!(p.view||p.edit);
}

let CURRENT = null;
function buildNav(){
  const nav=$('#nav'); nav.textContent='';
  SECTIONS.forEach(s=>{
    if(!can(s.id,'view')) return;
    const b=el('button'); b.type='button'; b.dataset.sec=s.id; b.onclick=()=>go(s.id);

    b.innerHTML='<span class="av" style="background:'+avBg(s.g)+'">'+s.ic+'</span><span class="nt"><b>'+esc(s.label)+'</b><small></small></span>';
    nav.appendChild(b);
  });
  updNavSub();
}
function navSub(id){
  if(id==='warehouse') return DB.warehouse.filter(n=>n.type==='item').length+' позиций';
  if(id==='bikes') return DB.bikes.length+' шт.';
  if(id==='electric') return 'в наличии: '+DB.bikes.filter(b=>b.present!==false).length;
  if(id==='price') return DB.services.length+' услуг';
  if(id==='repair') return 'в работе: '+DB.repairs.filter(r=>!r.done).length;
  if(id==='admin') return DB.staff.length+' сотрудников';
  if(id==='settings') return ME?lbl(ME):'';
  return '';
}
function updNavSub(){ $$('#nav button').forEach(b=>{const x=b.querySelector('small'); if(x) x.textContent=navSub(b.dataset.sec);}); }
function go(sec){
  CURRENT=sec; renderBk(sec);
  $$('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.sec===sec)); updNavSub();
  const m=$('#main'); m.textContent=''; window.scrollTo(0,0);
  if(sec==='warehouse') renderWarehouse(m);
  else if(sec==='bikes') renderBikes(m);
  else if(sec==='electric') renderElectric(m);
  else if(sec==='price') renderPrice(m);
  else if(sec==='repair') renderRepair(m);
  else if(sec==='admin') renderAdmin(m);

let WH = { curId:'', q:'' };
function renderWarehouse(m){
  m.textContent='';
  const card=el('div','card');
  card.appendChild(el('h2','','Склад'));
  const row=el('div','row'); row.style.marginBottom='10px';
  const search=el('div','search'); search.style.flex='1';
  const inp=el('input'); inp.type='search'; inp.placeholder='Поиск товара по словам…'; inp.value=WH.q;
  const clr=btn('×','clr',()=>{inp.value='';WH.q='';renderWarehouse($('#main'));});
  search.appendChild(inp); search.appendChild(clr);
  row.appendChild(search);
  if(can('warehouse','edit')) row.appendChild(btn('+ Категория','',()=>whForm('cat',null)));
  card.appendChild(row);
  const tree=el('div'); card.appendChild(tree); m.appendChild(card);
  inp.addEventListener('input',()=>{ WH.q=inp.value; loadWh(tree); });
  clr.style.display = WH.q?'block':'none';
  loadWh(tree);
}
function loadWh(tree){
  tree.textContent='';
  const byId={}; DB.warehouse.forEach(n=>byId[n.id]=n);
  if(WH.q.trim()){
    const words = WH.q.toLowerCase().replace(/ё/g,'е').split(/\s+/).filter(Boolean);
    const res = DB.warehouse.filter(n=>{
      if(n.type!=='item') return false;
      const path = whPath(n,byId);
      const h=(n.name+' '+path).toLowerCase().replace(/ё/g,'е');
      return words.every(w=>h.includes(w));
    });
    const bar=el('div','row'); bar.style.marginBottom='8px';
    bar.appendChild(btn('← Ко всем товарам','',()=>{WH.q='';WH.curId='';renderWarehouse($('#main'));}));
    bar.appendChild(el('span','mut','Найдено: '+res.length));
    tree.appendChild(bar);
    if(!res.length){ tree.appendChild(el('div','empty','Ничего не найдено')); return; }
    res.forEach(n=>tree.appendChild(whItemCard(n,byId,true)));
    return;
  }
  if(WH.curId && !byId[WH.curId]) WH.curId='';
  if(WH.curId){
    const cur=byId[WH.curId];
    const head=el('div','card'); head.style.background='var(--hov)';
    const hr=el('div','row');
    hr.appendChild(btn('← Назад','',()=>{WH.curId=cur.parentId||'';renderWarehouse($('#main'));}));
    const nm=el('div'); nm.style.flex='1'; nm.innerHTML='<b>'+esc(cur.name)+'</b>';
    hr.appendChild(nm);
    if(can('warehouse','edit')){
      hr.appendChild(btn('+ Подкатегория','',()=>whForm('cat',cur.id)));
      hr.appendChild(btn('+ Товар','p',()=>whForm('item',cur.id)));
      hr.appendChild(btn('✎','sm',()=>whForm('edit',cur)));
    }
    if(ME.role==='admin') hr.appendChild(btn('🗑','sm d',()=>whDelete(cur)));
    head.appendChild(hr); tree.appendChild(head);
  } else if(can('warehouse','edit')){
    const bar=el('div','row'); bar.style.marginBottom='8px';
    bar.appendChild(btn('+ Корневая категория','p',()=>whForm('cat',null)));
    tree.appendChild(bar);
  }
  const kids = DB.warehouse.filter(n=>n.parentId === (WH.curId||null)).sort((a,b)=>{
    if(a.type!==b.type) return a.type==='cat'?-1:1;
    return a.name.localeCompare(b.name,'ru');
  });
  if(!kids.length){ tree.appendChild(el('div','empty', WH.curId?'Пусто. Добавьте товар или подкатегорию.':'Пока пусто. Создайте категорию.')); return; }
  kids.forEach(n=>{
    if(n.type==='cat'){
      const c=el('div','tile');
      c.onclick=()=>{WH.curId=n.id;renderWarehouse($('#main'));};
      const sum = whSum(n.id, byId);
      c.innerHTML='<div class="n">📁 '+esc(n.name)+'</div><div class="p">Всего единиц: '+sum+'</div>';
      tree.appendChild(c);
    } else tree.appendChild(whItemCard(n,byId,false));
  });
}
function whSum(catId, byId){
  let s=0;
  DB.warehouse.forEach(n=>{
    if(n.type!=='item') return;
    let c=byId[n.parentId], g=0, ok=false;
    if(n.parentId===catId) ok=true;
    while(c&&g++<50){ if(c.id===catId) ok=true; c=byId[c.parentId]; }
    if(ok) s+=n.qty||0;
  });
  return s;
}
function whItemCard(n, byId, withPath){
  const card=el('div','card');
  const row=el('div','row');
  const nm=el('div'); nm.style.flex='1';
  nm.innerHTML='<div style="font-weight:600">'+esc(n.name)+'</div>'+(withPath?('<div class="mut">'+esc(whPath(n,byId))+'</div>'):'')+(n.note?('<div class="mut">'+esc(n.note)+'</div>'):'');
  row.appendChild(nm);
  const qty=el('div','row'); qty.style.gap='4px';
  if(can('warehouse','edit')){
    qty.appendChild(btn('−','sm',()=>whSetQty(n,(n.qty||0)-1)));
    qty.appendChild(el('b','',String(n.qty||0)));
    qty.appendChild(btn('+','sm',()=>whSetQty(n,(n.qty||0)+1)));
  } else qty.appendChild(el('b','',String(n.qty||0)));
  row.appendChild(qty);
  if(can('warehouse','edit')){
    const a=el('div','row'); a.style.gap='4px';
    a.appendChild(btn('✎','sm',()=>whForm('edit',n)));
    if(ME.role==='admin') a.appendChild(btn('🗑','sm d',()=>whDelete(n)));
    row.appendChild(a);
  }
  card.appendChild(row); return card;
}
function whPath(n,byId){
  let p=[],c=byId[n.parentId],g=0;
  while(c&&g++<50){p.unshift(c.name);c=byId[c.parentId];}
  return p.join(' › ');
}
async function whSetQty(n,v){
  if(v<0)v=0;
  const upd={qty:v, updatedAt:new Date().toISOString()};
  if(await dbUpdate('warehouse', n.id, upd)){
    n.qty=v; n.updatedAt=upd.updatedAt;
    await log(ME.name,'update','warehouse',n.id);
    renderWarehouse($('#main'));
  }
}
function whForm(mode,arg){
  openModal((box,close)=>{
    const isEdit = mode==='edit';
    const type = isEdit?arg.type:mode;
    box.appendChild(el('h3','',isEdit?'Редактировать':(type==='cat'?'Категория':'Товар')));
    const i1=el('input'); i1.value=isEdit?arg.name:'';
    box.appendChild(el('label','','Название')); box.appendChild(i1);
    let i2=null, i3=null;
    if(type==='item'){
      i2=el('input'); i2.type='number'; i2.min='0'; i2.value=isEdit?(arg.qty||0):1;
      box.appendChild(el('label','','Количество')); box.appendChild(i2);
      i3=el('textarea'); i3.rows=2; i3.value=isEdit?(arg.note||''):'';
      box.appendChild(el('label','','Примечание')); box.appendChild(i3);
    }
    const err=el('div'); err.style.color='var(--danger)'; err.style.fontSize='13px'; box.appendChild(err);
    const act=el('div','act'); act.appendChild(btn('Отмена','',close));
    act.appendChild(btn('Сохранить','p',async()=>{
      const name=i1.value.trim(); if(!name){err.textContent='Введите название';return;}
      if(isEdit){
        const patch={name};
        if(type==='item'){patch.qty=Math.max(0,parseInt(i2.value)||0);patch.note=i3.value.trim();}
        patch.updatedAt=new Date().toISOString();
        if(!await dbUpdate('warehouse', arg.id, patch)){err.textContent='Не удалось сохранить';return;}
        Object.assign(arg,patch);
        await log(ME.name,'update','warehouse',arg.id);
      } else {
        const node={id:uid("w_"),parentId:(typeof arg==='string')?arg:null,type,name,
          qty: type==='item'?(Math.max(0,parseInt(i2.value)||0)):0,
          note: i3?i3.value.trim():'',
          createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
        const created=await dbInsert('warehouse', node);
        if(!created){err.textContent='Не удалось сохранить';return;}
        DB.warehouse.push(created);
        await log(ME.name,'create','warehouse',node.id);
      }
      close(); toast('Сохранено'); renderWarehouse($('#main'));
    }));
    box.appendChild(act); setTimeout(()=>i1.focus(),30);
  });
}
function whDelete(n){
  openModal((box,close)=>{
    box.appendChild(el('h3','','Удалить «'+n.name+'»?'));
    box.appendChild(el('p','mut','Вложенные элементы тоже удалятся. Действие необратимо.'));
    const err=el('div'); err.style.color='var(--danger)'; box.appendChild(err);
    const act=el('div','act'); act.appendChild(btn('Отмена','',close));
    act.appendChild(btn('Удалить','d',async()=>{
      const toDel=new Set([n.id]);
      let changed=true;
      while(changed){
        changed=false;
        DB.warehouse.forEach(x=>{
          if(x.parentId && toDel.has(x.parentId) && !toDel.has(x.id)){ toDel.add(x.id); changed=true; }
        });
      }
      const ids=Array.from(toDel);
      if(!await dbDeleteMany('warehouse', ids)){err.textContent='Не удалось удалить';return;}
      DB.warehouse = DB.warehouse.filter(x=>!toDel.has(x.id));
      for(const id of ids) await log(ME.name,'delete','warehouse',id);
      close(); toast('Удалено'); renderWarehouse($('#main'));
    }));
    box.appendChild(act);
  });
}

function renderBikes(m){
  m.textContent='';
  const card=el('div','card');
  card.appendChild(el('h2','','Электровелосипеды'));
  const row=el('div','row'); row.style.marginBottom='10px';
  const inp=el('input'); inp.type='search'; inp.placeholder='Поиск по инв. № / раме / IoT'; inp.style.flex='1';
  row.appendChild(inp);
  if(can('bikes','edit')) row.appendChild(btn('+ Велосипед','p',()=>bikeForm(null)));
  card.appendChild(row);
  const list=el('div'); card.appendChild(list); m.appendChild(card);

  function load(){
    list.textContent='';
    const term=inp.value.trim().toLowerCase();
    let data = DB.bikes.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    if(term) data = data.filter(b=>
      (b.invNo||'').toLowerCase().includes(term) ||
      (b.frameNo||'').toLowerCase().includes(term) ||
      (b.iotNo||'').toLowerCase().includes(term)
    );
    if(!data.length){ list.appendChild(el('div','empty','Нет велосипедов')); return; }
    const tbl=el('table');
    tbl.innerHTML='<thead><tr><th>Инв. №</th><th>Рама</th><th>Марка/модель</th><th>Состояние</th><th></th></tr></thead>';
    const tb=el('tbody');
    data.forEach(b=>{
      const tr=el('tr');
      tr.innerHTML='<td>'+esc(b.invNo)+'</td><td>'+esc(b.frameNo)+'</td><td>'+esc((b.brand||'')+' '+(b.model||''))+'</td>'
        +'<td><span class="badge '+(b.state==='ready'?'ok':b.state==='broken'?'err':b.state==='wait_parts'?'warn':'')+'">'+esc(BIKE_STATES[b.state]||b.state)+'</span></td>';
      const td=el('td'); const a=el('div','row'); a.style.gap='4px';
      if(can('bikes','edit')) a.appendChild(btn('✎','sm',()=>bikeForm(b)));
      if(ME.role==='admin') a.appendChild(btn('🗑','sm d',async()=>{
        if(!confirm('Удалить велосипед '+b.invNo+'?')) return;
        if(!await dbDelete('bikes', b.id)) return;
        DB.bikes = DB.bikes.filter(x=>x.id!==b.id);
        DB.components = DB.components.filter(x=>x.bikeId!==b.id);
        await log(ME.name,'delete','bikes',b.id);
        toast('Удалено'); load();
      }));
      td.appendChild(a); tr.appendChild(td); tb.appendChild(tr);
    });
    tbl.appendChild(tb); list.appendChild(tbl);
  }
  inp.addEventListener('input',load);
  load();
}
function bikeForm(b){
  openModal((box,close)=>{
    box.appendChild(el('h3','',b?'Редактировать велосипед':'Новый велосипед'));
    const f={};
    const fields=[['invNo','Инвентарный номер *'],['frameNo','Номер рамы *'],['iotNo','Номер IoT-модуля'],['brand','Марка'],['model','Модель'],['desc','Описание'],['faults','Неисправности'],['notes','Примечание'],['handLast','Кто сдал: фамилия'],['handFirst','Кто сдал: имя'],['handPassSeries','Кто сдал: паспорт, серия'],['handPassNumber','Кто сдал: паспорт, номер']];
    fields.forEach(([k,label])=>{
      const i=el(['desc','faults','notes'].includes(k)?'textarea':'input');
      if(['desc','faults','notes'].includes(k)) i.rows=2; else i.type='text';
      i.value = b?(b[k]||''):'';
      box.appendChild(el('label','',label)); box.appendChild(i); f[k]=i;
    });
    const sel=el('select');
    Object.entries(BIKE_STATES).forEach(([k,v])=>{const o=el('option',null,v);o.value=k;sel.appendChild(o);});
    sel.value = b?b.state:'ready';
    box.appendChild(el('label','','Техническое состояние')); box.appendChild(sel); f.state=sel;
    const pw=el('div','chk'), pc=el('input'); pc.type='checkbox'; pc.checked=b?b.present!==false:true;
    pw.appendChild(pc); pw.appendChild(el('span',null,'В наличии (есть в сервисе)')); box.appendChild(pw);
    const err=el('div'); err.style.color='var(--danger)'; err.style.fontSize='13px'; box.appendChild(err);
    const act=el('div','act'); act.appendChild(btn('Отмена','',close));
    act.appendChild(btn('Сохранить','p',async()=>{
      const inv=f.invNo.value.trim(), frame=f.frameNo.value.trim();
      if(!inv||!frame){err.textContent='Инв. номер и номер рамы обязательны';return;}
      const dupInv = DB.bikes.find(x=>x.id!==(b?b.id:'') && x.invNo.toLowerCase()===inv.toLowerCase());
      if(dupInv){err.textContent='Инв. номер уже существует';return;}
      const dupFrame = DB.bikes.find(x=>x.id!==(b?b.id:'') && x.frameNo.toLowerCase()===frame.toLowerCase());
      if(dupFrame){err.textContent='Номер рамы уже существует';return;}
      const payload={invNo:inv,frameNo:frame,iotNo:f.iotNo.value.trim(),
        brand:f.brand.value.trim(),model:f.model.value.trim(),photoUrl:b?(b.photoUrl||''):'',
        state:f.state.value,present:pc.checked};
      ['desc','faults','notes','handLast','handFirst','handPassSeries','handPassNumber'].forEach(k=>payload[k]=f[k].value.trim());
      if(b){
        if(!await dbUpdate('bikes', b.id, payload)){err.textContent='Не удалось сохранить';return;}
        Object.assign(b,payload);
        await log(ME.name,'update','bikes',b.id);
      } else {
        const nb=Object.assign({id:uid("b_"),createdAt:new Date().toISOString()},payload);
        const created=await dbInsert('bikes', nb);
        if(!created){err.textContent='Не удалось сохранить';return;}
        DB.bikes.push(created);
        await log(ME.name,'create','bikes',nb.id);
      }
      close(); toast('Сохранено'); renderBikes($('#main'));
    }));
    box.appendChild(act);
  });
}

function renderAdmin(m){
  m.textContent='';
  if(ME.role!=='admin'){
    m.innerHTML='<div class="card"><h2>Доступ только для MARM</h2></div>'; return;
  }
  const tabs=el('div','tabs');
  const tabUsers=btn('Сотрудники','on',()=>showTab('users'));
  const tabLog=btn('Журнал действий','',()=>showTab('log'));
  const tabData=btn('Данные','',()=>showTab('data'));
  tabs.appendChild(tabUsers); tabs.appendChild(tabLog); tabs.appendChild(tabData);
  m.appendChild(tabs);
  const body=el('div'); m.appendChild(body);
  function showTab(t){
    [tabUsers,tabLog,tabData].forEach(b=>b.classList.remove('on'));
    ({users:tabUsers,log:tabLog,data:tabData})[t].classList.add('on');
    body.textContent='';
    if(t==='users') renderUsersTab(body);
    else if(t==='log') renderLogTab(body);
    else renderDataTab(body);
  }
  showTab('users');
}
function renderUsersTab(body){
  const card=el('div','card');
  card.appendChild(el('h2','','Сотрудники'));
  const row=el('div','row'); row.style.marginBottom='10px';
  row.appendChild(btn('+ Добавить сотрудника','p',()=>staffForm(null)));
  card.appendChild(row);
  const tbl=el('table');
  tbl.innerHTML='<thead><tr><th>Имя</th><th>Роль</th><th>Активен</th><th></th></tr></thead>';
  const tb=el('tbody');
  DB.staff.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','ru')).forEach(p=>{
    const tr=el('tr');
    tr.innerHTML='<td>'+(p.prefix?'<span class="badge">'+esc(p.prefix)+'</span> ':'')+esc(p.name)+(p.pinHash?'':' <span class="badge err">нет PIN</span>')+'</td>'
      +'<td><span class="badge '+(p.role==='admin'?'ok':'')+'">'+(p.role==='admin'?'Главный админ':'Сотрудник')+'</span></td>'
      +'<td><span class="badge '+(p.active?'ok':'err')+'">'+(p.active?'Да':'Нет')+'</span></td>';
    const td=el('td'); const a=el('div','row'); a.style.gap='4px';
    a.appendChild(btn('Права','sm',()=>permsForm(p)));
    a.appendChild(btn('✎','sm',()=>staffForm(p)));
    if(p.name!=='MARM'){
      a.appendChild(btn(p.active?'Откл.':'Вкл.','sm',async()=>{
        const nv=!p.active;
        if(await dbUpdate('staff', p.id, {active:nv})){
          p.active=nv;
          await log(ME.name,'update','staff',p.id);
          toast('Обновлено'); renderAdmin($('#main'));
        }
      }));
      a.appendChild(btn('🗑','sm d',async()=>{
        if(!confirm('Удалить сотрудника '+p.name+'?')) return;
        if(!await dbDelete('staff', p.id)) return;
        await supabaseClient.from('permissions').delete().eq('userId', p.id);
        DB.staff = DB.staff.filter(x=>x.id!==p.id);
        DB.permissions = DB.permissions.filter(x=>x.userId!==p.id);
        await log(ME.name,'delete','staff',p.id);
        toast('Удалено'); renderAdmin($('#main'));
      }));
    }
    td.appendChild(a); tr.appendChild(td); tb.appendChild(tr);
  });
  tbl.appendChild(tb); card.appendChild(tbl);
  body.appendChild(card);
}
function staffForm(p){
  openModal((box,close)=>{
    box.appendChild(el('h3','',p?'Изменить сотрудника':'Новый сотрудник'));
    const n=el('input'); n.value=p?p.name:'';
    box.appendChild(el('label','','Имя для входа')); box.appendChild(n);
    const rsel=el('select');
    [['employee','Сотрудник'],['admin','Главный админ']].forEach(([k,v])=>{const o=el('option',null,v);o.value=k;rsel.appendChild(o);});
    rsel.value = p?p.role:'employee';
    if(p && p.name==='MARM'){ rsel.disabled=true; }
    const pf=el('input'); pf.value=p?(p.prefix||''):''; pf.maxLength=40; pf.placeholder='Например: Механик';
    box.appendChild(el('label','','Префикс (должность)')); box.appendChild(pf);
    const pn=el('input'); pn.type='text'; pn.inputMode='numeric'; pn.maxLength=8; pn.autocomplete='off';
    pn.placeholder=p?'Оставьте пустым, чтобы не менять':'4–8 цифр';
    box.appendChild(el('label','','PIN-код для входа')); box.appendChild(pn);
    box.appendChild(el('label','','Роль')); box.appendChild(rsel);
    const err=el('div'); err.style.color='var(--danger)'; box.appendChild(err);
    const act=el('div','act'); act.appendChild(btn('Отмена','',close));
    act.appendChild(btn('Сохранить','p',async()=>{
      const name=n.value.trim(); if(!name){err.textContent='Введите имя';return;}
      const dup = DB.staff.find(x=>x.id!==(p?p.id:'') && x.name.toLowerCase()===name.toLowerCase());
      if(dup){err.textContent='Такое имя уже занято';return;}
      const pin=pn.value.trim(); let pr={};
      if(pin&&!/^\d{4,8}$/.test(pin)){err.textContent='PIN-код: 4–8 цифр';return;}
      if(!p&&!pin){err.textContent='Задайте PIN-код сотруднику';return;}
      if(pin){const salt=uid('x_'); pr={pinSalt:salt,pinHash:await hashPin(pin,salt)};}
      if(p){
        const patch=Object.assign({name,prefix:pf.value.trim()},pr);
        if(!rsel.disabled) patch.role=rsel.value;
        if(!await dbUpdate('staff', p.id, patch)){err.textContent='Не удалось сохранить';return;}
        Object.assign(p,patch);
        await log(ME.name,'update','staff',p.id);
      } else {
        const ns=Object.assign({id:uid("s_"),name,prefix:pf.value.trim(),role:rsel.value,active:true,createdAt:new Date().toISOString()},pr);
        const created=await dbInsert('staff', ns);
        if(!created){err.textContent='Не удалось сохранить';return;}
        DB.staff.push(created);
        await log(ME.name,'create','staff',ns.id);
      }
      close(); toast('Сохранено'); renderAdmin($('#main'));
    }));
    box.appendChild(act); setTimeout(()=>n.focus(),30);
  });
}
function permsForm(p){
  const map={}; DB.permissions.filter(x=>x.userId===p.id).forEach(r=>map[r.section]=r);
  openModal((box,close)=>{
    box.appendChild(el('h3','','Права: '+p.name));
    if(p.role==='admin') box.appendChild(el('p','mut','Главный администратор имеет полный доступ ко всем разделам.'));
    const items={};
    SECTIONS.forEach(s=>{
      if(s.id==='settings') return;
      const row=el('div','chk');
      const v=el('input'); v.type='checkbox'; v.checked = p.role==='admin' ? true : !!(map[s.id]&&(map[s.id].canView||map[s.id].canEdit));
      const e=el('input'); e.type='checkbox'; e.checked = p.role==='admin' ? true : !!(map[s.id]&&map[s.id].canEdit);
      e.onchange=()=>{ if(e.checked) v.checked=true; };
      const lab1=el('label'); lab1.style.margin='0'; lab1.appendChild(v); lab1.appendChild(document.createTextNode(' просмотр'));
      const lab2=el('label'); lab2.style.margin='0 0 0 12px'; lab2.appendChild(e); lab2.appendChild(document.createTextNode(' редактирование'));
      row.appendChild(el('span',null,s.label+':'));
      row.appendChild(lab1); row.appendChild(lab2);
      if(s.id==='price'){ e.disabled=true; e.checked=false; lab2.title='Изменение прайса только администратор'; }
      box.appendChild(row);
      items[s.id]={view:v,edit:e};
    });
    const err=el('div'); err.style.color='var(--danger)'; box.appendChild(err);
    const act=el('div','act'); act.appendChild(btn('Отмена','',close));
    act.appendChild(btn('Сохранить','p',async()=>{
      if(p.role==='admin'){ close(); return; }
      await supabaseClient.from('permissions').delete().eq('userId', p.id);
      DB.permissions = DB.permissions.filter(x=>x.userId!==p.id);
      for(const s of SECTIONS){
        const it=items[s.id]; if(!it) continue;
        let v=it.view.checked||it.edit.checked;
        let e=it.edit.checked&&s.id!=='price';
        if(v||e){
          const pr={id:uid("p_"),userId:p.id,section:s.id,canView:v,canEdit:e};
          await dbInsert('permissions', pr);
          DB.permissions.push(pr);
        }
      }
      await log(ME.name,'update','permissions',p.id);
      close(); toast('Права сохранены'); renderAdmin($('#main'));
    }));
    box.appendChild(act);
  });
}

async function exportDB(){
  try{
    const blob = new Blob([JSON.stringify(Object.assign({},DB,{__photos:await photoDump(DB.repairs.flatMap(r=>(r.photos||[]).map(x=>x.id)))}))],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ecovelo-backup-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('Резервная копия скачана');
  }catch(e){ toast('Ошибка экспорта: '+e.message); }
}

function applyTheme(t){document.documentElement.dataset.theme=t;}
function lbl(x){return (x.prefix?x.prefix+' ':'')+x.name;}
function byName(n){const x=DB.staff.find(y=>y.name===n);return x?lbl(x):(n||'—');}
function setUserInfo(){ $('#userInfo').textContent=lbl(ME); const a=$('#userAv'); a.textContent=ini(ME.name); a.style.background=avBg(ME.name); updNavSub(); if(CURRENT==='settings') renderSettings($('#main')); }
const GRAD=[['#ff885e','#ff516a'],['#ffcd6a','#ffa85c'],['#82b1ff','#665fff'],['#a0de7e','#54cb68'],['#53edd6','#28c9b7'],['#72d5fd','#2a9ef1'],['#e0a2f3','#d669ed'],['#9aa7b4','#6c7a89']];
function avBg(k){ let i=k; if(typeof k==='string'){ i=0; for(const c of k) i=(i*31+c.charCodeAt(0))%7; } const g=GRAD[i%GRAD.length]; return 'linear-gradient(135deg,'+g[0]+','+g[1]+')'; }
function ini(n){ return (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function setTheme(k){ try{localStorage.setItem('ecovelo_theme',k)}catch(e){} applyTheme(k==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):k); }
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(localStorage.getItem('ecovelo_theme')==='auto') setTheme('auto'); }); }catch(e){}

function pinModal(){ openModal((box,close)=>{
  box.appendChild(el('h3','','Сменить PIN-код'));
  const a=el('input'),b=el('input'),c=el('input'); [a,b,c].forEach(i=>{i.type='password';i.inputMode='numeric';i.maxLength=8;i.autocomplete='off';});
  box.appendChild(el('label','','Текущий PIN')); box.appendChild(a);
  box.appendChild(el('label','','Новый PIN (4–8 цифр)')); box.appendChild(b);
  box.appendChild(el('label','','Повторите новый PIN')); box.appendChild(c);
  const err=el('div'); err.style.color='var(--danger)'; box.appendChild(err);
  const act=el('div','act'); act.appendChild(btn('Отмена','',close));
  act.appendChild(btn('Сохранить','p',async()=>{
    if(!ME.pinHash||(await hashPin(a.value.trim(),ME.pinSalt))!==ME.pinHash){err.textContent='Текущий PIN неверный';return;}
    const n=b.value.trim(); if(!/^\d{4,8}$/.test(n)){err.textContent='PIN-код: 4–8 цифр';return;}
    if(n!==c.value.trim()){err.textContent='PIN-коды не совпадают';return;}
    const salt=uid('x_'), hash=await hashPin(n,salt);
    if(!await dbUpdate('staff', ME.id, {pinSalt:salt, pinHash:hash})){err.textContent='Не удалось сохранить';return;}
    ME.pinSalt=salt; ME.pinHash=hash;
    await log(ME.name,'update','staff',ME.id);
    close(); toast('PIN-код изменён');
  }));
  box.appendChild(act); setTimeout(()=>a.focus(),30);
});}

/* =========================================================
   ЧАТ (IndexedDB)
   ========================================================= */
let _idb;
function idb(){return _idb||(_idb=new Promise((ok,no)=>{const q=indexedDB.open('ecovelo_chat_v1',2);
  q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('msgs'))d.createObjectStore('msgs',{keyPath:'id'});if(!d.objectStoreNames.contains('files'))d.createObjectStore('files');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos');};
  q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error);}));}
function tx(st,mode,fn){return idb().then(d=>new Promise((ok,no)=>{const t=d.transaction(st,mode);const r=fn(t);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error);}));}
const photoPut=(id,b)=>tx('photos','readwrite',t=>t.objectStore('photos').put(b,id));
const photoGet=id=>tx('photos','readonly',t=>t.objectStore('photos').get(id));
const photoDel=id=>tx('photos','readwrite',t=>t.objectStore('photos').delete(id));
const PU={};
function photoUrl(id){ if(PU[id]) return Promise.resolve(PU[id]); return photoGet(id).then(b=>b?(PU[id]=URL.createObjectURL(b)):null); }
function compress(file){return new Promise(ok=>{const u=URL.createObjectURL(file),i=new Image();
  i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
    c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>ok(b||file),'image/jpeg',.8);};
  i.onerror=()=>{URL.revokeObjectURL(u);ok(file);}; i.src=u;});}
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
async function photoDump(ids){const o={};for(const id of ids){const b=await photoGet(id);if(b)o[id]=await b2d(b);}return o;}
async function photoLoad(o){for(const id of Object.keys(o||{})){if(await photoGet(id))continue;await photoPut(id,await (await fetch(o[id])).blob());}}
function viewPhotos(r){openModal((box,close)=>{
  box.appendChild(el('h3','','Фото при приёме: '+[r.clientLast,r.clientFirst].filter(Boolean).join(' ')));
  (r.photos||[]).forEach(x=>{const d=el('div');d.style.margin='10px 0';const i=el('img');i.style.cssText='max-width:100%;border-radius:8px;display:block';
    photoUrl(x.id).then(u=>{if(u)i.src=u;});d.appendChild(i);if(x.note)d.appendChild(el('div','mut',x.note));box.appendChild(d);});
  const a=el('div','act');a.appendChild(btn('Закрыть','',close));box.appendChild(a);});}

(async function boot(){
  applyTheme(document.documentElement.dataset.theme||'light');
  try{
    localStorage.setItem('__test__','1');
    localStorage.removeItem('__test__');
  }catch(e){
    alert('Браузер блокирует localStorage. Откройте файл через локальный сервер (например, python -m http.server) или через GitHub Pages.');
  }
  try{
    await initSupabase();
  }catch(e){
    showConnError('Не удалось подключиться к Supabase: '+e.message);
    return;
  }
  await loadAllFromServer();
  const s = loadSession();
  if(s){
    ME = s; PERMS = buildPerms(s);
    enterApp();
  } else {
    showLogin();
  }
})();
